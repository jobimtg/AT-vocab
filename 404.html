<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting｜YSP Learn & Shine</title>
  <script>
    const path = decodeURIComponent(window.location.pathname);
    const redirects = [
      { old: "/AT-vocab/CA Life/U1-L1/", next: "/AT-vocab/lessons/ca-life/u1-l1.html" },
      { old: "/AT-vocab/CA Life/U1-L1/index.html", next: "/AT-vocab/lessons/ca-life/u1-l1.html" },
      { old: "/AT-vocab/L1/", next: "/AT-vocab/lessons/travel/u1-l1.html" },
      { old: "/AT-vocab/L1/index.html", next: "/AT-vocab/lessons/travel/u1-l1.html" },
      { old: "/AT-vocab/L2/", next: "/AT-vocab/lessons/travel/u1-l2.html" },
      { old: "/AT-vocab/L2/index.html", next: "/AT-vocab/lessons/travel/u1-l2.html" },
      { old: "/AT-vocab/L6/", next: "/AT-vocab/lessons/travel/u1-l6.html" },
      { old: "/AT-vocab/L6/index.html", next: "/AT-vocab/lessons/travel/u1-l6.html" },
      { old: "/AT-vocab/BU1-L1/", next: "/AT-vocab/lessons/business/u1-l1.html" },
      { old: "/AT-vocab/BU1-L1/index.html", next: "/AT-vocab/lessons/business/u1-l1.html" }
    ];
    const match = redirects.find(item => path === item.old);
    if (match) {
      window.location.replace(match.next);
    }
  </script>
  <link rel="stylesheet" href="/AT-vocab/assets/css/site.css">
<!-- YSP_TOP_BUTTON_STYLE_START -->
<style>
  html {
    scroll-behavior: smooth;
  }

  .ysp-page-top-anchor {
    position: absolute;
    top: 0;
    left: 0;
    width: 1px;
    height: 1px;
    pointer-events: none;
  }

  .ysp-page-top-button {
    position: fixed;
    right: 24px;
    bottom: 24px;
    z-index: 99999;
    width: 58px;
    height: 58px;
    border-radius: 999px;
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1px;
    background: #1f1d1b;
    color: #ffffff;
    text-decoration: none;
    border: 1px solid rgba(255, 255, 255, 0.28);
    box-shadow: 0 14px 34px rgba(60, 43, 25, 0.22);
    opacity: 0.92;
    font-family: Inter, "Noto Sans TC", "Microsoft JhengHei", Arial, sans-serif;
  }

  .ysp-page-top-button:hover {
    transform: translateY(-2px);
    opacity: 1;
    transition: 180ms ease;
  }

  .ysp-page-top-arrow {
    font-size: 22px;
    line-height: 1;
    font-weight: 900;
  }

  .ysp-page-top-label {
    font-size: 11px;
    line-height: 1;
    font-weight: 900;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  @media (max-width: 700px) {
    .ysp-page-top-button {
      right: 16px;
      bottom: 16px;
      width: 52px;
      height: 52px;
    }

    .ysp-page-top-arrow {
      font-size: 20px;
    }

    .ysp-page-top-label {
      font-size: 10px;
    }
  }
/* YSP_SINGLE_TOP_BUTTON_STYLE_START */
.top-button {
  position: fixed;
  right: 22px;
  bottom: 22px;
  z-index: 9999;
  width: 56px;
  height: 56px;
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  border-radius: 999px;
  background: #1f1d1b;
  color: #ffffff;
  text-decoration: none;
  box-shadow: 0 14px 34px rgba(60, 43, 25, 0.22);
  font-weight: 950;
  line-height: 1;
}
.top-button .top-arrow {
  display: block;
  font-size: 20px;
  line-height: 1;
}
.top-button .top-label {
  display: block;
  margin-top: 3px;
  font-size: 10px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
/* YSP_SINGLE_TOP_BUTTON_STYLE_END */
</style>
<!-- YSP_TOP_BUTTON_STYLE_END -->
</head>

</body>
</html>
