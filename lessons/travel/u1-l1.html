function r6(){var h="<h2>🎭 Dialogue Practice — 對話練習 (5)</h2><p style=\"font-size:.76rem;color:var(--c-muted);margin-bottom:10px\">前 3 組必練 🏫，後 2 組選 1 組</p>";DIALOGUES.forEach(function(d){var tc=d.tag==="req"?"dtr":"dtc",tt=d.tag==="req"?"🏫 必練":"📖 選練";var ls="";d.lines.forEach(function(l){ls+="<div class=\"ln\"><span class=\"wh "+(l[0]==="A"?"wa":"wb")+"\">"+l[0]+"</span><div class=\"sp\">"+l[1]+"</div></div>";});h+="<div class=\"dlg\"><div class=\"dh\"><h3 style=\"margin:0;font-size:.85rem\">#"+d.id+" "+d.title+"<br><span style=\"font-size:.73rem;color:var(--c-muted)\">"+d.tz+"</span></h3><span class=\"dtag "+tc+"\">"+tt+"</span></div><div class=\"si\">📍 "+d.sit+"</div><div class=\"rl\"><div class=\"ro ra\">🧑 "+d.rA+"</div><div class=\"ro rb\">👤 "+d.rB+"</div></div><div class=\"ls\">"+ls+"</div><div class=\"tr\"><b>🎯 Now you try!</b><p>"+d.tp+"</p></div><div class=\"tg2\">Teacher notes ▾</div><div class=\"tn\">📋 "+d.tn+"</div></div>";});document.getElementById("t6").innerHTML=h;
// addEventListener for teacher notes toggle
document.querySelectorAll(".tg2").forEach(function(btn){btn.addEventListener("click",function(){var tn=btn.nextElementSibling;tn.classList.toggle("show");btn.textContent=tn.classList.contains("show")?"Teacher notes ▴":"Teacher notes ▾";});});}

function r7(){var tl={1:["Tier 1 — Warm-up","s1"],2:["Tier 2 — Guided","s2"],3:["Tier 3 — Free","s3"]};var h="<h2>🗣️ Speaking Questions — 口說練習 (5)</h2>";SPEAKING.forEach(function(s,i){var x=tl[s.t];h+="<div class=\"sq\"><span class=\"stl "+x[1]+"\">"+x[0]+"</span><div class=\"qq\">Q"+(i+1)+". "+s.q+"</div><div class=\"qh\">💡 "+s.h+"</div></div>";});document.getElementById("t7").innerHTML=h;}

function r8(){var h="<h2>🌍 Travel Culture — 旅行文化 (2)</h2>";CULTURE.forEach(function(c){var sl=c.slot==="warm-up"?"🌅 Warm-up（課堂開頭）":"🌇 Closing（課堂結尾）";var qs="";c.qs.forEach(function(q,i){qs+="<div class=\"cq\">Q"+(i+1)+". "+q+"</div>";});h+="<div class=\"cult\"><div class=\"cs\">"+sl+"</div><div class=\"ct\">"+c.title+"</div><div style=\"font-size:.8rem;color:var(--c-muted);margin-bottom:6px\">"+c.tz+"</div><div class=\"cp\">"+c.photo+"</div><div class=\"cn\">"+c.notes+"</div><h3 style=\"font-size:.78rem;margin:8px 0 4px\">Discussion Questions</h3>"+qs+"</div>";});document.getElementById("t8").innerHTML=h;}

function r9(){var h="<h2>📋 學習進度追蹤</h2><h3>Previously Learned — 已學詞彙 ("+PREV.reduce(function(a,p){return a+p.words.length},0)+")</h3>";
PREV.forEach(function(p){h+="<div class=\"pvh\" id=\"pvh_"+p.lesson+"\"><span>📖 "+p.lesson+"</span><span>▾</span></div><div class=\"pvb\" id=\"pvb_"+p.lesson+"\"><div class=\"pvl\">";p.words.forEach(function(w){h+="<div class=\"pvc\"><span class=\"pe\">"+w.en+"</span><span class=\"pz\">"+w.zh+"</span></div>";});h+="</div></div>";});
h+="<h3 style=\"margin-top:16px\">Pronunciation Progress</h3><div style=\"font-size:.82rem;padding:6px 0\"><span>🔄</span> <b>L01</b> Final Consonants 尾音</div>";

// addEventListener for accordion
document.querySelectorAll(".pvh").forEach(function(hdr){hdr.addEventListener("click",function(){hdr.nextElementSibling.classList.toggle("open");});});}
