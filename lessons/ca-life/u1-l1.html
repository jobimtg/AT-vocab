function renderImageOnlyCards(list, containerId, options){
  var cls = options && options.single ? 'single-col' : 'imgcards';
  var h = '<div class="'+cls+'">';
  list.forEach(function(item){
    h += '<div class="imgcard">';
    h += '<div class="imghead '+(options.headClass||'accent')+'"><span>'+item.title+'</span><span class="subh">'+(item.note||'')+'</span></div>';
    h += '<div class="imgbody">'+imageBlock(item.path, item.title)+'</div>';
    if(item.caption){h += '<div class="imgnote">'+item.caption+'</div>'}
    h += '</div>';
  });
  h += '</div>';
  document.getElementById(containerId).innerHTML = h;
}
function imageBlock(path, label){
  return '<img src="'+path+'" alt="'+label+'" loading="lazy" onerror="this.outerHTML=placeholderHTML('+JSON.stringify(path)+')">';
}
function placeholderHTML(path){
  return '\'' + '<div class="placeholder"><div>尚未放入圖片</div><div class="path">' + path + '</div></div>' + '\'';
}
