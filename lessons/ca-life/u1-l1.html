<style>

.brand{font-family:var(--font-b);font-size:.65rem;letter-spacing:3px;color:var(--c-accent);text-transform:uppercase;margin-bottom:4px}

.sub{font-size:.8rem;color:var(--c-muted)}.header{text-align:center;padding:20px 16px 14px;border-bottom:2px solid var(--c-accent)}
.tabs{display:flex;background:var(--c-primary);position:sticky;top:0;z-index:100;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tb{color:#fff;background:none;border:none;font-family:var(--font-b);font-size:.66rem;font-weight:500;padding:10px 12px;cursor:pointer;white-space:nowrap;opacity:.6;border-bottom:3px solid transparent;transition:all .2s}
.tb.on{opacity:1;border-bottom-color:var(--c-accent);background:rgba(200,149,108,.1)}
.tp{display:none;max-width:960px;margin:0 auto;padding:20px 16px}.tp.on{display:block}
/* Stats */
.sbar{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}.stat{background:var(--c-surface);border:1px solid var(--c-divider);border-radius:10px;padding:10px 14px;flex:1;min-width:80px;text-align:center}.sn{font-family:var(--font-b);font-size:1.3rem;font-weight:700;color:var(--c-primary)}.sl{font-size:.68rem;color:var(--c-muted);margin-top:2px}
.pbar{height:8px;background:var(--c-divider);border-radius:4px;overflow:hidden;margin:6px 0}.pf{height:100%;border-radius:4px;transition:width .5s}

.fbar{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.fb{border:1px solid var(--c-divider);background:var(--c-surface);border-radius:6px;padding:4px 10px;font-size:.7rem;font-family:var(--font-b);font-weight:500;cursor:pointer;transition:all .2s}
.fb.on{background:var(--c-primary);color:#fff;border-color:var(--c-primary)}
.fb.f1.on{background:var(--c-alert);border-color:var(--c-alert)}.fb.f2.on{background:var(--c-accent);border-color:var(--c-accent)}.fb.f3.on{background:var(--c-success);border-color:var(--c-success);color:#fff}
.sb{border:1px solid var(--c-divider);border-radius:6px;padding:4px 10px;font-size:.73rem;font-family:var(--font-c);min-width:100px;max-width:160px}

.cg{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}@media(max-width:480px){.cg{grid-template-columns:1fr}}

.vb{transform:rotateY(180deg)}.va{height:5px}
.bdg{position:absolute;top:8px;right:8px;font-size:.6rem;font-weight:700;padding:2px 6px;border-radius:4px;background:#D5F5E3;color:#1E8449;z-index:2}

.vf{display:flex;flex-direction:column;justify-content:center;align-items:center;padding:20px 14px}
.vf .pic{padding:2px 0 8px}.vf .pic svg{width:40px;height:40px;opacity:.85}
.vf .pr{font-size:.9rem;color:var(--c-muted);margin-bottom:6px}

.vb .zb{font-size:18px;font-weight:600;color:var(--c-accent);line-height:1.4;margin:3px 0 6px}

.vb .ex{font-size:18px;color:var(--c-muted);font-style:italic;line-height:1.5;margin:4px 0}
.vb .pl{font-size:14px;font-weight:600;color:var(--c-accent);margin-bottom:3px}
.vb .pi{font-size:18px;color:var(--c-text);line-height:1.5;margin:4px 0}

.dc{background:var(--c-surface);border:2px solid var(--c-divider);border-radius:14px;padding:30px 20px;text-align:center;min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;margin:14px 0;cursor:pointer;transition:border-color .3s}.dc:hover{border-color:var(--c-accent)}
.dc .dp{font-size:.75rem;color:var(--c-muted);margin-bottom:8px}.dc .dw{font-family:var(--font-h);font-size:1.6rem;color:var(--c-primary);margin:6px 0}.dc .ds{font-size:.85rem;color:var(--c-muted)}.dc .da{font-size:1.2rem;color:var(--c-accent);font-weight:700;margin:10px 0;display:none}.dc.sa .da{display:block}
.dn{display:flex;justify-content:space-between;align-items:center;margin:10px 0}
.db{padding:8px 20px;border:none;border-radius:8px;font-family:var(--font-b);font-weight:600;font-size:.78rem;cursor:pointer}
.lt{display:flex;gap:6px;margin-bottom:16px;justify-content:center}
.lb{padding:6px 16px;border:2px solid var(--c-divider);border-radius:8px;background:var(--c-surface);font-family:var(--font-b);font-size:.75rem;font-weight:600;cursor:pointer;transition:all .2s}.lb.on{background:var(--c-primary);color:#fff;border-color:var(--c-primary)}

const p=t>0?Math.round(c3/t*100):0;document.getElementById('pf2').style.width=p+'%';document.getElementById('pt2').textContent=(c1+c2+c3)>0?`掌握率 ${p}% (${c3}/${t})`:'點擊 Core 單字卡上的 🔴🟡🟢 開始評估';}

// T0 Stats
function r0(){document.getElementById('t0').innerHTML='<h2>📊 學習總覽</h2><div class="sbar" id="sb"></div><div class="pbar"><div class="pf" id="pf2" style="width:0%;background:var(--c-success)"></div></div><p style="font-size:.7rem;color:var(--c-muted);text-align:right" id="pt2">點擊 Core 單字卡上的 🔴🟡🟢 開始評估</p>';us();}
// T1 Core
function r1(){let h='<h2>📚 Core Vocabulary — 核心詞彙 (25)</h2><div class="fbar">';
h+='<button class="fb on" data-f="all">全部 ('+V.length+')</button>';
CATS.forEach((c,i)=>{const n=V.filter(v=>v.cat===i).length;h+=`<button class="fb" data-f="${i}" style="border-left:3px solid ${CC[i]}">${c} (${n})</button>`;});
h+='<span style="margin-left:auto;display:flex;gap:3px"><button class="fb f1" data-ff="1">🔴</button><button class="fb f2" data-ff="2">🟡</button><button class="fb f3" data-ff="3">🟢</button></span>';
h+='<input type="text" class="sb" placeholder="🔍" id="cs"></div><div class="cg">';
V.forEach((v,i)=>{h+=`<div class="vc" data-i="${i}" data-g="${v.cat}" data-en="${v.en}" data-zh="${v.zh}" onclick="this.classList.toggle('fl')"><div class="vi"><div class="vf"><span class="bdg">★ Core</span><div class="va" style="background:${CC[v.cat]}"></div><div class="pic">${v.svg}</div><div class="pr">${v.pr}</div><div class="ew">${v.en}</div><div class="fh">tap to flip →</div><div class="famb" onclick="event.stopPropagation()"><button class="fm f1c" data-l="1" onclick="sf(${i},1)">🔴 不知道</button><button class="fm f2c" data-l="2" onclick="sf(${i},2)">🟡 有印象</button><button class="fm f3c" data-l="3" onclick="sf(${i},3)">🟢 已經會</button></div></div><div class="vb"><div class="va" style="background:${CC[v.cat]}"></div><div class="eb">${v.en}</div><div class="zb">${v.zh}</div><div class="dv"></div><div class="mg">📖 ${v.m1}</div><div class="mg">📖 ${v.m2}</div><div class="dv"></div><div class="ex">📝 ${v.e1}</div><div class="ex">📝 ${v.e2}</div><div class="dv"></div><div class="pl">✏ Try using this word:</div><div class="pi">1. ${v.p1}</div><div class="pi">2. ${v.p2}</div></div></div></div>`;});
h+='</div>';document.getElementById('t1').innerHTML=h;
document.querySelectorAll('.vc').forEach(c=>{const f=c.querySelector('.vf'),b=c.querySelector('.vb');requestAnimationFrame(()=>{const ht=Math.max(f.scrollHeight,b.scrollHeight,280);c.style.minHeight=ht+'px';c.querySelector('.vi').style.height=ht+'px';f.style.height=ht+'px';b.style.height=ht+'px';});});
document.querySelectorAll('.fbar .fb[data-f]').forEach(b=>{b.addEventListener('click',()=>{document.querySelectorAll('.fbar .fb[data-f]').forEach(x=>x.classList.remove('on'));b.classList.add('on');const f=b.dataset.f;document.querySelectorAll('.vc').forEach(c=>{c.style.display=(f==='all'||c.dataset.g==f)?'':'none';});});});
document.querySelectorAll('.fb[data-ff]').forEach(b=>{b.addEventListener('click',()=>{b.classList.toggle('on');const af=[...document.querySelectorAll('.fb[data-ff].on')].map(x=>x.dataset.ff);if(!af.length)document.querySelectorAll('.vc').forEach(c=>c.style.display='');else document.querySelectorAll('.vc').forEach(c=>{c.style.display=af.includes(String(fam[c.dataset.i]))?'':'none';});});});
document.getElementById('cs').addEventListener('input',function(){const q=this.value.toLowerCase();document.querySelectorAll('.vc').forEach(c=>{c.style.display=(c.dataset.en.includes(q)||c.dataset.zh.includes(q))?'':'none';});});}
// T2 Extended
function r2(){let h='<h2>📖 Extended Reference — 延伸詞彙 (30)</h2><div class="fbar" id="ef"></div><div class="eg" id="eG"></div>';
document.getElementById('t2').innerHTML=h;
let ef='<button class="fb on" data-ef="all">全部</button>';CATS.forEach((c,i)=>{ef+=`<button class="fb" data-ef="${i}" style="border-left:3px solid ${CC[i]}">${c}</button>`;});
document.getElementById('ef').innerHTML=ef;
let eg='';EXT.forEach(e=>{eg+=`<div class="ec" data-ec="${e.cat}" style="border-left-color:${CC[e.cat]}"><div class="en">${e.en}</div><div class="pr">${e.pr}</div><div class="zh">${e.zh}</div><div class="mg">${e.m}</div><div class="ex">📝 ${e.ex}</div></div>`;});
document.getElementById('eG').innerHTML=eg;
document.querySelectorAll('#ef .fb').forEach(b=>{b.addEventListener('click',()=>{document.querySelectorAll('#ef .fb').forEach(x=>x.classList.remove('on'));b.classList.add('on');const f=b.dataset.ef;document.querySelectorAll('.ec').forEach(c=>{c.style.display=(f==='all'||c.dataset.ec==f)?'':'none';});});});}
// T3 Drilling
let dL=1,dI=0;
function r3(){document.getElementById('t3').innerHTML='<h2>🔁 Drilling 三關練習</h2><p style="font-size:.78rem;color:var(--c-muted);margin-bottom:14px">L1 跟唸 → L2 整句跟唸 → L3 中翻英</p><div class="lt"><button class="lb on" onclick="sL(1)">L1 跟唸</button><button class="lb" onclick="sL(2)">L2 整句</button><button class="lb" onclick="sL(3)">L3 中翻英</button></div><div class="dzone" id="dz"></div>';rd();}
function sL(l){dL=l;dI=0;document.querySelectorAll('.lb').forEach((b,i)=>b.classList.toggle('on',i===l-1));rd();}
function rd(){const v=V[dI],z=document.getElementById('dz');let pr='',w='',s='',a='';
if(dL===1){pr='🔊 老師唸 → 學生跟唸 3 次';w=v.en;s=v.pr;a=v.zh;}
else if(dL===2){pr='🔊 老師唸整句 → 學生跟唸';w=v.e1;s='';a=v.zh+' — '+v.en;}
else{pr='看中文 → 說英文';w=v.zh;s='';a=v.en+' '+v.pr;}
z.innerHTML=`<div class="dc" onclick="this.classList.toggle('sa')"><div class="dp">${pr}</div><div class="dw">${w}</div><div class="ds">${s}</div><div class="da">💡 ${a}</div><div style="font-size:.65rem;color:var(--c-muted);margin-top:8px">點擊翻牌看答案</div></div><div class="dn"><button class="db" style="background:var(--c-divider);color:var(--c-text)" onclick="dI=Math.max(0,dI-1);rd()">← 上一個</button><span style="font-size:.78rem;color:var(--c-muted)">${dI+1} / ${V.length}</span><button class="db" style="background:var(--c-primary);color:#fff" onclick="dI=Math.min(V.length-1,dI+1);rd()">下一個 →</button></div>`;}
// T4 Phrases
function r4(){let h='<h2>💬 Useful Phrases — 實用句型 (5)</h2>';PHRASES.forEach(p=>{const tg=p.t==='core'?'<div class="tg" style="color:#1E8449">🏫 In-class</div>':'<div class="tg" style="color:#2471A3">📖 Self-study</div>';h+=`<div class="phr">${tg}<div class="en">"${p.en}"</div><div class="zh">${p.zh}</div><div class="nt">💡 ${p.note}</div></div>`;});document.getElementById('t4').innerHTML=h;}
// T5 Pronunciation
function r5(){let pw=PRON.words.map(w=>`<div class="wd"><b>${w.w}</b> ${w.ipa}<br><span style="font-size:.7rem;color:var(--c-alert)">✗ ${w.bad}</span> → <span style="color:var(--c-success)">✓ ${w.w}</span><br><span style="font-size:.68rem;color:var(--c-muted)">${w.tip}</span></div>`).join('');
document.getElementById('t5').innerHTML=`<h2>🎯 Pronunciation Spotlight — 發音焦點</h2><div class="prc"><div style="font-size:.7rem;color:var(--c-accent);font-weight:600">🎯 PRONUNCIATION SPOTLIGHT</div><div class="fo">${PRON.focus}</div><div style="font-size:.8rem;color:var(--c-muted)">${PRON.fz}</div><div class="pw">${pw}</div><div class="tp" style="display:block">💡 ${PRON.tip}</div><div style="font-size:.85rem;color:var(--c-primary);font-weight:500;margin-top:6px">🗣️ ${PRON.prac}</div></div>`;}
// T6 Dialogues
function r6(){let h='<h2>🎭 Dialogue Practice — 對話練習 (5)</h2><p style="font-size:.76rem;color:var(--c-muted);margin-bottom:10px">前 3 組必練 🏫，後 2 組選 1 組</p>';
DIALOGUES.forEach(d=>{const tc=d.tag==='req'?'dtr':'dtc',tt=d.tag==='req'?'🏫 必練':'📖 選練';
let ls=d.lines.map(l=>`<div class="ln"><span class="wh ${l[0]==='A'?'wa':'wb'}">${l[0]}</span><div class="sp">"${l[1]}"</div></div>`).join('');
h+=`<div class="dlg"><div class="dh"><h3 style="margin:0;font-size:.85rem">#${d.id} ${d.title}<br><span style="font-size:.73rem;color:var(--c-muted)">${d.tz}</span></h3><span class="dt ${tc}">${tt}</span></div><div class="si">📍 ${d.sit}</div><div class="rl"><div class="ro ra">🧑 ${d.rA}</div><div class="ro rb">👤 ${d.rB}</div></div><div class="ls">${ls}</div><div class="tr"><b>🎯 Now you try!</b><p>${d.tp}</p></div><div class="tg2" onclick="const t=this.nextElementSibling;t.classList.toggle('show');this.textContent=t.classList.contains('show')?'Teacher notes ▴':'Teacher notes ▾'">Teacher notes ▾</div><div class="tn">📋 ${d.tn}</div></div>`;});
document.getElementById('t6').innerHTML=h;}
// T7 Speaking
function r7(){const tl={1:['Tier 1 — Warm-up','s1'],2:['Tier 2 — Guided','s2'],3:['Tier 3 — Free','s3']};let h='<h2>🗣️ Speaking Questions — 口說練習 (5)</h2>';
SPEAKING.forEach((s,i)=>{const[l,c]=tl[s.t];h+=`<div class="sq"><span class="st ${c}">${l}</span><div class="qq">Q${i+1}. ${s.q}</div><div class="qh">💡 ${s.h}</div></div>`;});document.getElementById('t7').innerHTML=h;}
// T8 Culture
function r8(){let h='<h2>🌍 Canadian Culture — 加拿大文化 (2)</h2>';CULTURE.forEach(c=>{const sl=c.slot==='warm-up'?'🌅 Warm-up（課堂開頭）':'🌇 Closing（課堂結尾）';const qs=c.qs.map((q,i)=>`<div class="cq">Q${i+1}. ${q}</div>`).join('');
h+=`<div class="cult"><div class="cs">${sl}</div><div class="ct">${c.title}</div><div style="font-size:.8rem;color:var(--c-muted);margin-bottom:6px">${c.tz}</div><div class="cp">${c.photo}</div><div class="cn">${c.notes}</div><h3 style="font-size:.78rem;margin:8px 0 4px">Discussion Questions</h3>${qs}</div>`;});
document.getElementById('t8').innerHTML=h;}
// T9 Progress
function r9(){let h='<h2>📋 學習進度追蹤</h2><h3>Previously Learned — 已學詞彙</h3><p style="font-size:.82rem;color:var(--c-muted);margin-bottom:12px">這是第一堂課，尚無已學詞彙。從 L02 開始會顯示。</p><h3>Pronunciation Progress — 發音教學進度</h3><div style="font-size:.82rem;padding:6px 0"><span>🔄</span> <b>L01-L02</b> /θ/ /ð/ th 音</div>';
document.getElementById('t9').innerHTML=h;}
document.addEventListener('DOMContentLoaded',()=>{r0();r1();r2();r3();r4();r5();r6();r7();r8();r9();});
</script>
</body>
