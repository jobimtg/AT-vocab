name: YSP Site Maintenance

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "lessons/**/*.html"
      - "index.html"
      - "lessons/index.html"
      - "js/ysp-global-nav.js"
      - ".github/workflows/ysp-site-maintenance.yml"
      - "scripts/ysp_site_maintenance.py"

permissions:
  contents: write

jobs:
  ysp-site-maintenance:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Scan lessons, add global nav loader, update lesson cards
        shell: bash
        run: |
          python3 scripts/ysp_site_maintenance.py

      - name: Commit safe maintenance changes
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"

            git add index.html lessons/index.html lessons/**/*.html

            if git diff --cached --quiet; then
              echo "No staged changes."
            else
              git commit -m "YSP site maintenance"
              git push
            fi
          else
            echo "No changes to commit."
          fi
          
