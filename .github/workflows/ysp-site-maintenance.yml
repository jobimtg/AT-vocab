name: YSP Site Maintenance

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "lessons/**/*.html"
      - "lessons/**/assets/**"
      - "image-inbox/**"
      - "index.html"
      - "lessons/index.html"
      - "js/ysp-global-nav.js"
      - ".github/workflows/ysp-site-maintenance.yml"
      - "scripts/ysp_site_maintenance.py"
      - "scripts/ysp_validate_site.py"
      - "scripts/ysp_image_inbox_guard.py"
      - "scripts/ysp_gallery_quality_check.py"
      - "scripts/ysp_lesson_contract_check.py"

permissions:
  contents: write

jobs:
  ysp-site-maintenance:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Guard image inbox sizes
        shell: bash
        run: |
          python3 scripts/ysp_image_inbox_guard.py

      - name: Scan lessons, add global nav loader, update lesson cards and image galleries
        shell: bash
        run: |
          python3 scripts/ysp_site_maintenance.py

      - name: Validate generated lesson content contract
        shell: bash
        run: |
          python3 scripts/ysp_lesson_contract_check.py

      - name: Validate site after maintenance
        shell: bash
        run: |
          set +e
          site_validation_output="$(python3 scripts/ysp_validate_site.py 2>&1)"
          site_validation_status=$?
          gallery_validation_output="$(python3 scripts/ysp_gallery_quality_check.py 2>&1)"
          gallery_validation_status=$?
          set -e

          printf '%s\n' "$site_validation_output"
          echo
          printf '%s\n' "$gallery_validation_output"

          {
            echo "## YSP Site Validation"
            echo
            if [[ "$site_validation_status" -eq 0 ]]; then
              echo "✅ Site validation completed with no blocking errors."
            else
              echo "⚠️ Site validation found issues."
            fi
            echo
            echo '```text'
            printf '%s\n' "$site_validation_output"
            echo '```'
            echo
            echo "## YSP Gallery Quality Check"
            echo
            if [[ "$gallery_validation_status" -eq 0 ]]; then
              echo "✅ Gallery quality check completed with no blocking errors."
            else
              echo "⚠️ Gallery quality check found issues."
            fi
            echo
            echo '```text'
            printf '%s\n' "$gallery_validation_output"
            echo '```'
            echo
            echo "This validation step is currently report-only so maintenance can continue."
          } >> "$GITHUB_STEP_SUMMARY"

          exit 0

      - name: Commit safe maintenance changes
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"

            git add -A index.html lessons/index.html lessons image-inbox

            if git diff --cached --quiet; then
              echo "No staged changes."
            else
              git commit -m "YSP site maintenance"
              git push
            fi
          else
            echo "No changes to commit."
          fi
