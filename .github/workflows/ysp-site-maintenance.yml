name: YSP Site Maintenance

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "lessons/**/*.html"
      - "lessons/**/assets/**"
      - "image-inbox/**"
      - "index.html"
      - "lessons/index.html"
      - "js/ysp-global-nav.js"
      - ".github/workflows/ysp-site-maintenance.yml"
      - "scripts/ysp_site_maintenance.py"
      - "scripts/ysp_validate_site.py"

permissions:
  contents: write

jobs:
  ysp-site-maintenance:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Scan lessons, add global nav loader, update lesson cards and image galleries
        shell: bash
        run: |
          python3 scripts/ysp_site_maintenance.py

      - name: Validate site after maintenance
        shell: bash
        run: |
          set +e
          validation_output="$(python3 scripts/ysp_validate_site.py 2>&1)"
          validation_status=$?
          set -e

          printf '%s\n' "$validation_output"

          {
            echo "## YSP Site Validation"
            echo
            if [[ "$validation_status" -eq 0 ]]; then
              echo "✅ Validation completed with no blocking errors."
            else
              echo "⚠️ Validation found issues."
              echo
              echo "This step is currently report-only, so maintenance can continue."
              echo "Review the output below before starting large lesson production."
            fi
            echo
            echo '```text'
            printf '%s\n' "$validation_output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          exit 0

      - name: Commit safe maintenance changes
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"

            git add -A index.html lessons/index.html lessons image-inbox

            if git diff --cached --quiet; then
              echo "No staged changes."
            else
              git commit -m "YSP site maintenance"
              git push
            fi
          else
            echo "No changes to commit."
          fi
