name: Update YSP Progress Tracker

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-progress-tracker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Generate progress tracker
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os

          root = Path.cwd()
          docs = root / "docs"
          docs.mkdir(parents=True, exist_ok=True)
          out = docs / "YSP_PROGRESS_TRACKER.md"

          def exists_file(relative_path):
              return (root / relative_path).is_file()

          def exists_dir(relative_path):
              return (root / relative_path).is_dir()

          def read_text(relative_path):
              path = root / relative_path
              if not path.is_file():
                  return ""
              return path.read_text(encoding="utf-8", errors="ignore")

          def contains(relative_path, text):
              return text in read_text(relative_path)

          def any_file_under(*relative_dirs):
              for relative_dir in relative_dirs:
                  folder = root / relative_dir
                  if folder.exists():
                      for path in folder.rglob("*"):
                          if path.is_file():
                              return True
              return False

          def lesson_preview_exists():
              lessons = root / "lessons"
              if not lessons.exists():
                  return False
              for path in lessons.rglob("*.html"):
                  if path.name.lower() == "index.html":
                      continue
                  text = path.read_text(encoding="utf-8", errors="ignore")
                  if "YSP_PREVIEW_LESSON" in text or "Free Preview" in text:
                      return True
              return False

          def status(done):
              return "Done" if done else "Pending"

          def mark(done):
              return "✅ Done" if done else "⏳ Pending"

          def percent(items):
              if not items:
                  return 0
              done_count = sum(1 for item in items if item)
              return round(done_count * 100 / len(items))

          old_workflows = [
              ".github/workflows/auto-update-lessons-after-upload.yml",
              ".github/workflows/refresh-lesson-navigation.yml",
              ".github/workflows/check-course-links-v3-report-only.yml",
              ".github/workflows/check-course-links-v2.yml",
              ".github/workflows/check-site-links.yml",
              ".github/workflows/add-lesson-navigation.yml",
              ".github/workflows/add-lesson-navigation-v2.yml",
          ]

          homepage_exists = exists_file("index.html")
          lessons_exists = exists_file("lessons/index.html")
          step1_workflow_exists = exists_file(".github/workflows/step1-revenue-positioning.yml")
          clean_lesson_workflow_exists = exists_file(".github/workflows/auto-update-lessons-clean-header.yml")
          old_workflows_removed = not any(exists_file(item) for item in old_workflows)
          no_workflow_reports = not exists_dir(".github/workflow-reports")

          home_section = (
              contains("index.html", "YSP_STEP1_REVENUE_HOME_START")
              or contains("index.html", "practice-packs")
              or contains("index.html", "Practice Packs")
          )

          lessons_section = (
              contains("lessons/index.html", "YSP_STEP1_REVENUE_LESSONS_START")
              or contains("lessons/index.html", "how-lessons-work")
              or contains("lessons/index.html", "Practice Pack")
          )

          step1_sections_done = home_section and lessons_section
          preview_exists = lesson_preview_exists()
          pack_exists = any_file_under("practice-packs", "products/practice-packs")

          index_lower = read_text("index.html").lower()
          payment_link = (
              "payhip.com" in index_lower
              or "ko-fi.com" in index_lower
              or "gumroad.com" in index_lower
          )

          revenue_items = [
              ("Reframe website positioning", True, "Change from free course database to preview + paid/student-only practice pack gateway.", "Tracker exists"),
              ("Keep GitHub Pages as brand entrance", homepage_exists, "Use GitHub for trust, course paths, previews, and CTAs.", "index.html exists"),
              ("Avoid Substack as main system", True, "Reduce weekly content and email-list management.", "Strategy confirmed"),
              ("Avoid AdSense as first income source", True, "Avoid needing lots of public free content and high traffic.", "Strategy confirmed"),
              ("Choose practice pack model", home_section, "Full materials become student-only or paid packs.", "Homepage contains practice pack section"),
          ]

          timeline_items = [
              ("Upload Step 1 workflow", step1_workflow_exists, "Add .github/workflows/step1-revenue-positioning.yml.", "Workflow file exists"),
              ("Run Step 1 workflow", step1_sections_done, "Add positioning sections to homepage and Lessons page.", "Homepage and Lessons markers exist"),
              ("Check homepage", home_section, "Confirm homepage has Preview + Practice Pack section.", "Homepage marker exists"),
              ("Check Lessons page", lessons_section, "Confirm Lessons explains Preview / Practice Pack / Guided Lesson.", "Lessons marker exists"),
              ("Select first preview lesson", False, "Choose one lesson, recommended L01 Welcome to Canada.", "Manual confirmation"),
              ("Convert first lesson to preview", preview_exists, "Public page should show only sample content.", "A lesson contains YSP_PREVIEW_LESSON or Free Preview"),
              ("Create first practice pack", pack_exists, "Complete PDF / worksheet / review pack for the first lesson.", "practice-packs/ or products/practice-packs/ contains a file"),
          ]

          checklist_items = [
              ("Keep lesson content unchanged at first", True, "Step 1 only changes positioning, not all course content.", "Strategy decision"),
              ("Add Practice Pack CTA", home_section or lessons_section, "Homepage or Lessons page shows practice pack CTA.", "Practice pack marker exists"),
              ("Keep one clean automation workflow", clean_lesson_workflow_exists and old_workflows_removed, "Only clean lesson automation workflow remains.", "Old workflow files removed"),
              ("Remove duplicate reports", no_workflow_reports, "No .github/workflow-reports/ folder in repo.", "Folder does not exist"),
              ("Test with current 3 students", False, "Ask whether the pack helps after class.", "Manual confirmation"),
              ("Decide payment platform later", payment_link, "Payhip / Ko-fi / Gumroad decision comes after first pack.", "Payment platform link appears on homepage"),
          ]

          next_action = None
          for name, done, target, auto in timeline_items + checklist_items:
              if not done:
                  next_action = (name, target)
                  break

          if next_action is None:
              next_action = ("Ready for next phase", "Step 1 tracker is complete.")

          def table_rows(items, second_header, third_header):
              lines = [
                  f"| Status | {second_header} | {third_header} | Auto Check |",
                  "|---|---|---|---|",
              ]
              for name, done, purpose, auto in items:
                  lines.append(f"| {mark(done)} | {name} | {purpose} | {auto} |")
              return lines

          all_bools = [item[1] for item in revenue_items + timeline_items + checklist_items]

          lines = []
          lines.append("# YSP Learn & Shine — Progress Tracker")
          lines.append("")
          lines.append("> This file is automatically updated by `.github/workflows/update-ysp-progress-tracker.yml`.")
          lines.append("> Review this before starting the next step.")
          lines.append("")
          lines.append("## Current Dashboard")
          lines.append("")
          lines.append("| Area | Progress |")
          lines.append("|---|---:|")
          lines.append(f"| Revenue Strategy | {percent([item[1] for item in revenue_items])}% |")
          lines.append(f"| Step 1 Website Positioning | {percent([item[1] for item in timeline_items])}% |")
          lines.append(f"| Next-Step Readiness | {percent([item[1] for item in checklist_items])}% |")
          lines.append(f"| Overall | {percent(all_bools)}% |")
          lines.append("")
          lines.append("## Next Action Before Moving Forward")
          lines.append("")
          lines.append("| Priority | Next Step | Why / Target |")
          lines.append("|---:|---|---|")
          lines.append(f"| 1 | {next_action[0]} | {next_action[1]} |")
          lines.append("")
          lines.append("## Revenue Strategy Tracker")
          lines.append("")
          lines.extend(table_rows(revenue_items, "Item", "Purpose"))
          lines.append("")
          lines.append("## Step 1 Timeline Tracker")
          lines.append("")
          lines.extend(table_rows(timeline_items, "Step", "Target"))
          lines.append("")
          lines.append("## Step 1 Checklist Tracker")
          lines.append("")
          lines.extend(table_rows(checklist_items, "Task", "Done When"))
          lines.append("")
          lines.append("## Notes")
          lines.append("")
          lines.append("- Auto-detectable items update when GitHub Actions runs.")
          lines.append("- Real-world decisions still show as manual confirmation until a file, marker, or payment link exists.")
          lines.append("- This file replaces the previous scattered strategy / timeline / checklist docs.")
          lines.append("- No separate report files are created.")
          lines.append("")

          out.write_text("\n".join(lines), encoding="utf-8")
          print("Updated docs/YSP_PROGRESS_TRACKER.md")
          print(f"Next step: {next_action[0]}")
          PY

      - name: Commit progress tracker
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add docs/YSP_PROGRESS_TRACKER.md

          if git diff --cached --quiet; then
            echo "No progress tracker changes to commit."
          else
            git commit -m "Update YSP progress tracker"
            git push
          fi
