name: YSP Progress Dashboard

on:
  workflow_dispatch:
  push:
    paths:
      - "index.html"
      - "lessons/index.html"
      - "lessons/**/*.html"
      - "practice-packs/**"
      - "products/practice-packs/**"
      - ".github/workflows/*.yml"

permissions:
  contents: read

jobs:
  progress-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Show progress dashboard
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os

          root = Path.cwd()

          def exists_file(path):
              return (root / path).is_file()

          def exists_dir(path):
              return (root / path).is_dir()

          def read_text(path):
              p = root / path
              if not p.is_file():
                  return ""
              return p.read_text(encoding="utf-8", errors="ignore")

          def contains(path, text):
              return text in read_text(path)

          def any_file_under(*folders):
              for folder in folders:
                  p = root / folder
                  if p.exists():
                      for item in p.rglob("*"):
                          if item.is_file():
                              return True
              return False

          def lesson_preview_exists():
              lessons = root / "lessons"
              if not lessons.exists():
                  return False
              for item in lessons.rglob("*.html"):
                  if item.name.lower() == "index.html":
                      continue
                  text = item.read_text(encoding="utf-8", errors="ignore")
                  if "YSP_PREVIEW_LESSON" in text or "Free Preview" in text:
                      return True
              return False

          def mark(done):
              return "✅ Done" if done else "⏳ Pending"

          def percent(values):
              if not values:
                  return 0
              return round(sum(1 for value in values if value) * 100 / len(values))

          old_workflows = [
              ".github/workflows/auto-update-lessons-after-upload.yml",
              ".github/workflows/refresh-lesson-navigation.yml",
              ".github/workflows/check-course-links-v3-report-only.yml",
              ".github/workflows/check-course-links-v2.yml",
              ".github/workflows/check-site-links.yml",
              ".github/workflows/add-lesson-navigation.yml",
              ".github/workflows/add-lesson-navigation-v2.yml",
              ".github/workflows/update-ysp-progress-tracker.yml",
          ]

          homepage_exists = exists_file("index.html")
          lessons_exists = exists_file("lessons/index.html")
          step1_workflow_exists = exists_file(".github/workflows/step1-revenue-positioning.yml")
          clean_lesson_workflow_exists = exists_file(".github/workflows/auto-update-lessons-clean-header.yml")
          old_workflows_removed = not any(exists_file(item) for item in old_workflows)
          no_workflow_reports = not exists_dir(".github/workflow-reports")

          home_section = (
              contains("index.html", "YSP_STEP1_REVENUE_HOME_START")
              or contains("index.html", "practice-packs")
              or contains("index.html", "Practice Packs")
          )

          lessons_section = (
              contains("lessons/index.html", "YSP_STEP1_REVENUE_LESSONS_START")
              or contains("lessons/index.html", "how-lessons-work")
              or contains("lessons/index.html", "Practice Pack")
          )

          step1_sections_done = home_section and lessons_section
          preview_exists = lesson_preview_exists()
          pack_exists = any_file_under("practice-packs", "products/practice-packs")

          homepage_text = read_text("index.html").lower()
          payment_link = (
              "payhip.com" in homepage_text
              or "ko-fi.com" in homepage_text
              or "gumroad.com" in homepage_text
          )

          revenue_items = [
              ("Reframe website positioning", True, "Website becomes preview + practice pack gateway."),
              ("Keep GitHub Pages as brand entrance", homepage_exists, "index.html exists."),
              ("Avoid Substack as main system", True, "No weekly email/content burden."),
              ("Avoid AdSense as first income source", True, "No need to publish all content free."),
              ("Choose practice pack model", home_section, "Homepage contains practice pack positioning."),
          ]

          timeline_items = [
              ("Upload Step 1 workflow", step1_workflow_exists, "Add step1-revenue-positioning.yml."),
              ("Run Step 1 workflow", step1_sections_done, "Homepage and Lessons positioning sections exist."),
              ("Check homepage", home_section, "Homepage has Preview + Practice Pack section."),
              ("Check Lessons page", lessons_section, "Lessons explains Preview / Practice Pack / Guided Lesson."),
              ("Select first preview lesson", False, "Manual choice: recommended L01 Welcome to Canada."),
              ("Convert first lesson to preview", preview_exists, "A lesson contains YSP_PREVIEW_LESSON or Free Preview."),
              ("Create first practice pack", pack_exists, "practice-packs/ or products/practice-packs/ contains a file."),
          ]

          checklist_items = [
              ("Keep lesson content unchanged at first", True, "Step 1 only changes positioning."),
              ("Add Practice Pack CTA", home_section or lessons_section, "Practice pack CTA exists."),
              ("Keep one clean automation workflow", clean_lesson_workflow_exists and old_workflows_removed, "Old workflow files removed."),
              ("Remove duplicate reports", no_workflow_reports, "No .github/workflow-reports folder."),
              ("Test with current 3 students", False, "Manual confirmation after first pack."),
              ("Decide payment platform later", payment_link, "Payhip / Ko-fi / Gumroad link appears."),
          ]

          next_action = None
          for name, done, target in timeline_items + checklist_items:
              if not done:
                  next_action = (name, target)
                  break
          if next_action is None:
              next_action = ("Ready for next phase", "Step 1 is complete.")

          def table(title, rows, second_label):
              output = []
              output.append(f"## {title}")
              output.append("")
              output.append(f"| Status | {second_label} | Target / Check |")
              output.append("|---|---|---|")
              for name, done, target in rows:
                  output.append(f"| {mark(done)} | {name} | {target} |")
              output.append("")
              return output

          all_values = [item[1] for item in revenue_items + timeline_items + checklist_items]

          lines = []
          lines.append("# YSP Learn & Shine — Progress Dashboard")
          lines.append("")
          lines.append("This dashboard is display-only. It does not create reports, does not edit files, and does not push commits.")
          lines.append("")
          lines.append("## Current Dashboard")
          lines.append("")
          lines.append("| Area | Progress |")
          lines.append("|---|---:|")
          lines.append(f"| Revenue Strategy | {percent([item[1] for item in revenue_items])}% |")
          lines.append(f"| Step 1 Website Positioning | {percent([item[1] for item in timeline_items])}% |")
          lines.append(f"| Next-Step Readiness | {percent([item[1] for item in checklist_items])}% |")
          lines.append(f"| Overall | {percent(all_values)}% |")
          lines.append("")
          lines.append("## Next Action Before Moving Forward")
          lines.append("")
          lines.append("| Priority | Next Step | Why / Target |")
          lines.append("|---:|---|---|")
          lines.append(f"| 1 | {next_action[0]} | {next_action[1]} |")
          lines.append("")
          lines.extend(table("Revenue Strategy Tracker", revenue_items, "Item"))
          lines.extend(table("Step 1 Timeline Tracker", timeline_items, "Step"))
          lines.extend(table("Step 1 Checklist Tracker", checklist_items, "Task"))
          lines.append("## Notes")
          lines.append("")
          lines.append("- This workflow replaces the failing `update-ysp-progress-tracker.yml` approach.")
          lines.append("- It shows the dashboard in the GitHub Actions Summary only.")
          lines.append("- It does not create `docs/YSP_PROGRESS_TRACKER.md` and does not create `.github/workflow-reports/`.")
          lines.append("- This is the lowest-maintenance version.")

          result = "\n".join(lines) + "\n"

          summary_file = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_file:
              Path(summary_file).write_text(result, encoding="utf-8")

          print(result)
          PY
