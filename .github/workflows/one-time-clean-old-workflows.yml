name: One Time Clean Old Workflows

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean-old-workflows:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Remove old duplicate workflows
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil

          ROOT = Path.cwd()

          remove_files = [
              ".github/workflows/add-lesson-navigation.yml",
              ".github/workflows/add-top-button-all-pages.yml",
              ".github/workflows/auto-update-lessons-clean-header.yml",
              ".github/workflows/check-course-links-v2.yml",
              ".github/workflows/check-course-links-v3-report-only.yml",
              ".github/workflows/check-site-links.yml",
              ".github/workflows/fix-homepage-hero-banner-title.yml",
              ".github/workflows/reorganize-at-vocab-site.yml",
              ".github/workflows/update-homepage-buttons-top.yml",
              ".github/workflows/update-homepage-copy-scamper.yml",
              ".github/workflows/update-homepage-course-images.yml",
              ".github/workflows/update-homepage-hero-image.yml",
              ".github/workflows/update-homepage-hero-title-one-line.yml",
              ".github/workflows/update-lessons-hero-copy.yml",
          ]

          removed = []
          missing = []

          for item in remove_files:
              path = ROOT / item
              if path.exists():
                  path.unlink()
                  removed.append(item)
              else:
                  missing.append(item)

          report_dir = ROOT / ".github" / "workflow-reports"
          if report_dir.exists():
              shutil.rmtree(report_dir)
              removed.append(".github/workflow-reports/")

          print("Removed workflow cleanup summary")
          print("================================")
          print("Removed:")
          if removed:
              for item in removed:
                  print(f"- {item}")
          else:
              print("- None")

          print("")
          print("Already missing:")
          if missing:
              for item in missing:
                  print(f"- {item}")
          else:
              print("- None")
          PY

      - name: Commit and push cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No cleanup changes to commit."
          else
            git commit -m "Clean old duplicate workflows"
            git push
          fi
