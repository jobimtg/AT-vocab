            gap: 18px;
          }

          .course-card,
          .lesson-card {
            display: block;
            padding: 26px;
            background: rgba(255, 255, 255, 0.82);
            border: 1px solid var(--line);
            border-radius: 28px;
            box-shadow: 0 16px 38px var(--soft);
            text-decoration: none;
          }

          .course-card:hover,
          .lesson-card:hover {
            transform: translateY(-2px);
