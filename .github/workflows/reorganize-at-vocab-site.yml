            color: var(--muted);
            font-size: 13px;
          }

          .about-box {
            padding: 34px;
            background: rgba(255, 250, 242, 0.78);
            border: 1px solid var(--line);
            border-radius: 32px;
            box-shadow: 0 16px 38px var(--soft);
          }

          .about-box p {
