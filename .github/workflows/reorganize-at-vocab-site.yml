          html {
            scroll-behavior: smooth;
          }

          body {
            margin: 0;
            font-family: Inter, "Noto Sans TC", "Microsoft JhengHei", Arial, sans-serif;
            background:
              radial-gradient(circle at top left, rgba(207, 161, 91, 0.16), transparent 34%),
              linear-gradient(180deg, #fffaf2 0%, var(--bg) 48%, #f5ecdf 100%);
            color: var(--ink);
          }

          img {
            max-width: 100%;
            height: auto;
          }

          a {
            color: inherit;
          }

          .site-header {
            position: sticky;
            top: 0;
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
            padding: 18px 7%;
            background: rgba(255, 250, 242, 0.92);
            backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--line);
          }

          .brand {
            display: inline-flex;
            align-items: center;
            gap: 14px;
            text-decoration: none;
          }

          .header-logo {
            height: 64px;
            width: auto;
            display: block;
          }

          .brand-text {
            display: flex;
            flex-direction: column;
            line-height: 1.1;
          }

          .brand-name {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.08em;
          }

