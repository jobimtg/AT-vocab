name: Reorganize AT Vocab Website

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reorganize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reorganize website structure
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil

          ROOT = Path.cwd()

          def ensure_dir(path):
              (ROOT / path).mkdir(parents=True, exist_ok=True)

          def write_file(path, content):
              target = ROOT / path
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content, encoding="utf-8")

          def copy_lesson(src, dest, title):
              src_path = ROOT / src
              dest_path = ROOT / dest
              dest_path.parent.mkdir(parents=True, exist_ok=True)

              if dest_path.exists():
                  print(f"Skip existing lesson page: {dest}")
                  return

              if src_path.exists():
                  print(f"Copy {src} -> {dest}")
                  shutil.copyfile(src_path, dest_path)
              else:
                  print(f"Missing {src}; create placeholder {dest}")
                  write_file(dest, placeholder_page(title))

          def placeholder_page(title):
              return f'''<!DOCTYPE html>
          <html lang="zh-Hant">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>{title}</title>
            <link rel="stylesheet" href="../../assets/css/site.css">
          </head>
          <body>
            <main class="simple-page">
              <h1>{title}</h1>
              <p>This lesson page is coming soon.</p>
              <a class="btn-primary" href="../">Back to Lessons</a>
            </main>
          </body>
          </html>
          '''

          def redirect_page(target, title):
              return f'''<!DOCTYPE html>
          <html lang="zh-Hant">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <meta http-equiv="refresh" content="0; url={target}">
            <title>Redirecting...</title>
          </head>
          <body>
            <p>Redirecting to <a href="{target}">{title}</a></p>
            <script>
              window.location.replace("{target}");
            </script>
          </body>
          </html>
          '''

          for folder in [
              "assets/css",
              "assets/js",
              "assets/img",
              "lessons/ca-life",
              "lessons/travel",
              "lessons/business",
          ]:
              ensure_dir(folder)

          write_file(".nojekyll", "")
          write_file("assets/img/.gitkeep", "")

          copy_lesson("CA Life/U1-L1/index.html", "lessons/ca-life/u1-l1.html", "Canada Life & Career English U1-L1")
          copy_lesson("L1/index.html", "lessons/travel/u1-l1.html", "Travel English U1-L1")
          copy_lesson("L2/index.html", "lessons/travel/u1-l2.html", "Travel English U1-L2")
          copy_lesson("L6/index.html", "lessons/travel/u1-l6.html", "Travel English U1-L6")
          copy_lesson("BU1-L1/index.html", "lessons/business/u1-l1.html", "Business English U1-L1")

          site_css = r''':root {
            --bg: #f8f3ea;
            --paper: #fffaf2;
            --card: #ffffff;
            --ink: #1f1d1b;
            --muted: #756b5f;
            --gold: #cfa15b;
            --line: #e7dccd;
