name: Check Course Links V3 Report Only

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-course-links:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check homepage and Lessons links without failing
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import urlparse, unquote

          ROOT = Path.cwd()
          REPORT_DIR = ROOT / ".github" / "workflow-reports"
          REPORT_DIR.mkdir(parents=True, exist_ok=True)
          REPORT_FILE = REPORT_DIR / "course-link-check-report.md"

          CHECK_FILES = [
              ROOT / "index.html",
              ROOT / "lessons" / "index.html",
          ]

          IGNORE_SCHEMES = {"http", "https", "mailto", "tel", "javascript", "data"}

          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.links = []
                  self.assets = []
                  self.ids = set()

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)

                  if "id" in attrs:
                      self.ids.add(attrs["id"])
                  if "name" in attrs:
                      self.ids.add(attrs["name"])

                  if tag == "a" and attrs.get("href"):
                      self.links.append(("href", attrs["href"]))

                  if tag in {"img", "script", "iframe", "source"} and attrs.get("src"):
                      self.assets.append(("src", attrs["src"]))

                  if tag == "link" and attrs.get("href"):
                      self.assets.append(("asset", attrs["href"]))

          def parse_html(path):
              parser = Parser()
              parser.feed(path.read_text(encoding="utf-8", errors="ignore"))
              return parser

          def target_for(base_file, raw_url):
              raw_url = raw_url.strip()
              parsed = urlparse(raw_url)

              if not raw_url:
                  return None, None, "empty"

              if parsed.scheme in IGNORE_SCHEMES or raw_url.startswith("//"):
                  return None, None, "external"

              path_part = unquote(parsed.path)
              anchor = unquote(parsed.fragment) if parsed.fragment else None

              if path_part == "":
                  target = base_file
              elif path_part.startswith("/"):
                  clean = path_part.lstrip("/")
                  if clean.startswith("AT-vocab/"):
                      clean = clean[len("AT-vocab/"):]
                  target = ROOT / clean
              else:
                  target = base_file.parent / path_part

              if raw_url.endswith("/") or (path_part and not Path(path_part).suffix):
                  if target.is_dir():
                      target = target / "index.html"
                  elif (target / "index.html").exists():
                      target = target / "index.html"

              return target.resolve(), anchor, "internal"

          parsed_files = {}
          missing_files = []
          missing_anchors = []
          checked = 0
          scanned_files = []

          for file in CHECK_FILES:
              if not file.exists():
                  try:
                      rel = file.relative_to(ROOT).as_posix()
                  except Exception:
                      rel = str(file)
                  missing_files.append(("(required file)", "file", rel))
                  continue

              scanned_files.append(file.relative_to(ROOT).as_posix())
              parser = parse_html(file)
              parsed_files[file.resolve()] = parser

              all_items = parser.links + parser.assets

              for kind, url in all_items:
                  target, anchor, status = target_for(file, url)

                  if status != "internal":
                      continue

                  checked += 1
                  base_rel = file.relative_to(ROOT).as_posix()

                  if target is None:
                      continue

                  if not target.exists():
                      missing_files.append((base_rel, kind, url))
                      continue

                  if anchor and target.suffix.lower() in {".html", ".htm"}:
                      target_parser = parsed_files.get(target)

                      if target_parser is None:
                          try:
                              target_parser = parse_html(target)
                              parsed_files[target] = target_parser
                          except Exception:
                              target_parser = None

                      if target_parser is not None and anchor not in target_parser.ids:
                          try:
                              target_rel = target.relative_to(ROOT).as_posix()
                          except Exception:
                              target_rel = str(target)
                          missing_anchors.append((base_rel, url, target_rel, anchor))

          report = []
          report.append("# Course Link Check Report V3")
          report.append("")
          report.append("This workflow is report-only. It will not fail the GitHub Action when missing files or anchors are found.")
          report.append("")
          report.append("## Scanned Files")
          report.append("")
          for item in scanned_files:
              report.append(f"- `{item}`")
          report.append("")
          report.append("## Summary")
          report.append("")
          report.append(f"- Internal links/assets checked: **{checked}**")
          report.append(f"- Missing files: **{len(missing_files)}**")
          report.append(f"- Missing anchors: **{len(missing_anchors)}**")
          report.append("")

          if missing_files:
              report.append("## Missing Files")
              report.append("")
              for base, kind, url in missing_files:
                  report.append(f"- `{base}` → `{kind}` → `{url}`")
              report.append("")

          if missing_anchors:
              report.append("## Missing Anchors")
              report.append("")
              for base, url, target, anchor in missing_anchors:
                  report.append(f"- `{base}` → `{url}` → target `{target}` does not contain id/name `{anchor}`")
              report.append("")

          if not missing_files and not missing_anchors:
              report.append("✅ No broken homepage / Lessons course links found.")
              report.append("")

          REPORT_FILE.write_text("\n".join(report) + "\n", encoding="utf-8")
          print("\n".join(report))
          PY

      - name: Commit link report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add .github/workflow-reports/course-link-check-report.md

          if git diff --cached --quiet; then
            echo "No report changes to commit."
          else
            git commit -m "Update course link check report"
            git push
          fi
