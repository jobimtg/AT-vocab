name: Step 1 Revenue Positioning

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  step1-revenue-positioning:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Add preview and practice pack positioning
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          ROOT = Path.cwd()
          INDEX = ROOT / "index.html"
          LESSONS_INDEX = ROOT / "lessons" / "index.html"
          CSS = ROOT / "assets" / "css" / "site.css"

          STYLE_START = "/* YSP_STEP1_REVENUE_POSITIONING_START */"
          STYLE_END = "/* YSP_STEP1_REVENUE_POSITIONING_END */"

          HOME_START = "<!-- YSP_STEP1_REVENUE_HOME_START -->"
          HOME_END = "<!-- YSP_STEP1_REVENUE_HOME_END -->"

          LESSONS_START = "<!-- YSP_STEP1_REVENUE_LESSONS_START -->"
          LESSONS_END = "<!-- YSP_STEP1_REVENUE_LESSONS_END -->"

          def strip_block(text, start, end, flags=re.S):
              pattern = re.escape(start) + r".*?" + re.escape(end)
              return re.sub(pattern, "", text, flags=flags)

          def add_css():
              CSS.parent.mkdir(parents=True, exist_ok=True)
              css = CSS.read_text(encoding="utf-8", errors="ignore") if CSS.exists() else ""
              css = strip_block(css, STYLE_START, STYLE_END)
              block = "\n".join([
                  STYLE_START,
                  ".ysp-revenue-section {",
                  "  max-width: 1180px;",
                  "  margin: 72px auto;",
                  "  padding: 0 24px;",
                  "}",
                  "",
                  ".ysp-revenue-card {",
                  "  border: 1px solid rgba(196, 147, 93, 0.28);",
                  "  border-radius: 28px;",
                  "  background: rgba(255, 255, 255, 0.82);",
                  "  box-shadow: 0 18px 50px rgba(60, 43, 25, 0.08);",
                  "  padding: clamp(28px, 4vw, 54px);",
                  "}",
                  "",
                  ".ysp-revenue-eyebrow {",
                  "  margin: 0 0 10px;",
                  "  color: #c4935d;",
                  "  font-size: 12px;",
                  "  font-weight: 900;",
                  "  letter-spacing: 0.28em;",
                  "  text-transform: uppercase;",
                  "}",
                  "",
                  ".ysp-revenue-title {",
                  "  margin: 0;",
                  "  color: #13213b;",
                  "  font-size: clamp(30px, 4vw, 52px);",
                  "  line-height: 1.08;",
                  "  letter-spacing: -0.035em;",
                  "}",
                  "",
                  ".ysp-revenue-copy {",
                  "  max-width: 760px;",
                  "  margin: 16px 0 0;",
                  "  color: #6f6257;",
                  "  font-size: 17px;",
                  "  line-height: 1.75;",
                  "}",
                  "",
                  ".ysp-revenue-grid {",
                  "  display: grid;",
                  "  grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));",
                  "  gap: 16px;",
                  "  margin-top: 28px;",
                  "}",
                  "",
                  ".ysp-revenue-mini {",
                  "  border-radius: 20px;",
                  "  background: #fffaf1;",
                  "  border: 1px solid rgba(196, 147, 93, 0.22);",
                  "  padding: 18px;",
                  "}",
                  "",
                  ".ysp-revenue-mini strong {",
                  "  display: block;",
                  "  color: #13213b;",
                  "  font-size: 17px;",
                  "  margin-bottom: 8px;",
                  "}",
                  "",
                  ".ysp-revenue-mini span {",
                  "  display: block;",
                  "  color: #74685d;",
                  "  font-size: 14px;",
                  "  line-height: 1.6;",
                  "}",
                  "",
                  ".ysp-revenue-actions {",
                  "  display: flex;",
                  "  flex-wrap: wrap;",
                  "  gap: 12px;",
                  "  margin-top: 30px;",
                  "}",
                  "",
                  ".ysp-revenue-btn {",
                  "  display: inline-flex;",
                  "  align-items: center;",
                  "  justify-content: center;",
                  "  min-height: 46px;",
                  "  padding: 12px 18px;",
                  "  border-radius: 999px;",
                  "  border: 1px solid rgba(196, 147, 93, 0.36);",
                  "  color: #13213b;",
                  "  background: #ffffff;",
                  "  text-decoration: none;",
                  "  font-weight: 900;",
                  "  box-shadow: 0 10px 24px rgba(60, 43, 25, 0.08);",
                  "}",
                  "",
                  ".ysp-revenue-btn.primary {",
                  "  background: #162849;",
                  "  border-color: #162849;",
                  "  color: #ffffff;",
                  "}",
                  "",
                  ".ysp-revenue-note {",
                  "  margin-top: 18px;",
                  "  color: #8a7b6d;",
                  "  font-size: 13px;",
                  "  line-height: 1.65;",
                  "}",
                  "",
                  "@media (max-width: 700px) {",
                  "  .ysp-revenue-section {",
                  "    margin: 52px auto;",
                  "    padding: 0 18px;",
                  "  }",
                  "}",
                  STYLE_END,
              ])
              CSS.write_text(css.rstrip() + "\n\n" + block + "\n", encoding="utf-8")

          def home_section():
              return "\n".join([
                  HOME_START,
                  "<section class=\"ysp-revenue-section\" id=\"practice-packs\">",
                  "  <div class=\"ysp-revenue-card\">",
                  "    <p class=\"ysp-revenue-eyebrow\">FREE PREVIEW + FULL PRACTICE PACKS</p>",
                  "    <h2 class=\"ysp-revenue-title\">Learn from the preview. Practice deeper with the full pack.</h2>",
                  "    <p class=\"ysp-revenue-copy\">Start with free preview lessons for real life, travel, and career English. Full practice packs are designed for active students and future self-study learners who want vocabulary, dialogues, speaking drills, review tasks, and answer keys in one place.</p>",
                  "    <div class=\"ysp-revenue-grid\">",
                  "      <div class=\"ysp-revenue-mini\">",
                  "        <strong>Free Preview Lessons</strong>",
                  "        <span>Short public lessons that help new visitors understand the learning style before booking or buying.</span>",
                  "      </div>",
                  "      <div class=\"ysp-revenue-mini\">",
                  "        <strong>Full Practice Packs</strong>",
                  "        <span>Complete review materials for deeper practice after class or self-study.</span>",
                  "      </div>",
                  "      <div class=\"ysp-revenue-mini\">",
                  "        <strong>Live Lesson Support</strong>",
                  "        <span>Students can book lessons when they want guided speaking practice and feedback.</span>",
                  "      </div>",
                  "    </div>",
                  "    <div class=\"ysp-revenue-actions\">",
                  "      <a class=\"ysp-revenue-btn primary\" href=\"lessons/\">View Preview Lessons</a>",
                  "      <a class=\"ysp-revenue-btn\" href=\"https://en.amazingtalker.com/teachers-and-tutors/jobi-pan#timeslots\">Book a Trial Lesson</a>",
                  "      <a class=\"ysp-revenue-btn\" href=\"#practice-packs\">Practice Packs Coming Soon</a>",
                  "    </div>",
                  "    <p class=\"ysp-revenue-note\">Step 1 positioning: the website becomes a preview and conversion system. Full lesson materials should gradually move into student-only or paid practice packs.</p>",
                  "  </div>",
                  "</section>",
                  HOME_END,
              ])

          def lessons_section():
              return "\n".join([
                  LESSONS_START,
                  "<section class=\"ysp-revenue-section\" id=\"how-lessons-work\">",
                  "  <div class=\"ysp-revenue-card\">",
                  "    <p class=\"ysp-revenue-eyebrow\">HOW THIS LESSON LIBRARY WORKS</p>",
                  "    <h2 class=\"ysp-revenue-title\">Preview the path. Keep the full practice for deeper learning.</h2>",
                  "    <p class=\"ysp-revenue-copy\">These public lesson pages are designed to help learners explore the course path and sample the learning style. Full practice packs are reserved for active students and future paid self-study materials.</p>",
                  "    <div class=\"ysp-revenue-grid\">",
                  "      <div class=\"ysp-revenue-mini\">",
                  "        <strong>1. Preview</strong>",
                  "        <span>Use the public lesson page to understand the topic, goals, and sample language.</span>",
                  "      </div>",
                  "      <div class=\"ysp-revenue-mini\">",
                  "        <strong>2. Practice Pack</strong>",
                  "        <span>Use the full pack for vocabulary review, dialogues, speaking drills, and answer keys.</span>",
                  "      </div>",
                  "      <div class=\"ysp-revenue-mini\">",
                  "        <strong>3. Guided Lesson</strong>",
                  "        <span>Book a class when you want correction, pronunciation support, and speaking practice.</span>",
                  "      </div>",
                  "    </div>",
                  "    <div class=\"ysp-revenue-actions\">",
                  "      <a class=\"ysp-revenue-btn primary\" href=\"../index.html#practice-packs\">Practice Pack Model</a>",
                  "      <a class=\"ysp-revenue-btn\" href=\"https://en.amazingtalker.com/teachers-and-tutors/jobi-pan#timeslots\">Book a Trial Lesson</a>",
                  "    </div>",
                  "  </div>",
                  "</section>",
                  LESSONS_END,
              ])

          def insert_before_about_or_body(html, block):
              html = strip_block(html, HOME_START, HOME_END)

              about_match = re.search(r"<section\\b[^>]*(id=[\"']about[\"']|class=[\"'][^\"']*about[^\"']*[\"'])[^>]*>", html, flags=re.I)
              if about_match:
                  return html[:about_match.start()] + block + "\n" + html[about_match.start():]

              if re.search(r"</body\\s*>", html, flags=re.I):
                  return re.sub(r"</body\\s*>", block + "\n</body>", html, count=1, flags=re.I)

              return html + "\n" + block + "\n"

          def insert_after_hero_or_before_auto(html, block):
              html = strip_block(html, LESSONS_START, LESSONS_END)

              auto_pos = html.find("<!-- YSP_AUTO_LESSON_LIBRARY_START -->")
              if auto_pos != -1:
                  return html[:auto_pos] + block + "\n" + html[auto_pos:]

              hero_pattern = re.compile(r"(<section\\b(?=[^>]*class=[\"'][^\"']*\\bhero\\b)[^>]*>.*?</section>)", flags=re.I | re.S)
              match = hero_pattern.search(html)
              if match:
                  return html[:match.end()] + "\n" + block + html[match.end():]

              if re.search(r"</body\\s*>", html, flags=re.I):
                  return re.sub(r"</body\\s*>", block + "\n</body>", html, count=1, flags=re.I)

              return html + "\n" + block + "\n"

          add_css()

          changes = []

          if INDEX.exists():
              html = INDEX.read_text(encoding="utf-8", errors="ignore")
              updated = insert_before_about_or_body(html, home_section())
              if updated != html:
                  INDEX.write_text(updated, encoding="utf-8")
                  changes.append("Updated index.html with Practice Pack positioning section.")
          else:
              changes.append("Skipped index.html because it does not exist.")

          if LESSONS_INDEX.exists():
              html = LESSONS_INDEX.read_text(encoding="utf-8", errors="ignore")
              updated = insert_after_hero_or_before_auto(html, lessons_section())
              if updated != html:
                  LESSONS_INDEX.write_text(updated, encoding="utf-8")
                  changes.append("Updated lessons/index.html with lesson library positioning section.")
          else:
              changes.append("Skipped lessons/index.html because it does not exist.")

          print("Step 1 Revenue Positioning")
          print("==========================")
          for item in changes:
              print(f"- {item}")
          PY

      - name: Commit and push changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add step 1 revenue positioning"
            git push
          fi
