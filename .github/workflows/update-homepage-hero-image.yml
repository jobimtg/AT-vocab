name: Update Homepage Hero Image

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-homepage-hero:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add hero image to homepage
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          ROOT = Path.cwd()
          index_path = ROOT / "index.html"
          css_path = ROOT / "assets/css/site.css"
          report_dir = ROOT / ".github/workflow-reports"
          report_dir.mkdir(parents=True, exist_ok=True)
          report_path = report_dir / "homepage-hero-image-report.txt"

          if not index_path.exists():
              raise SystemExit("index.html not found.")

          html = index_path.read_text(encoding="utf-8", errors="ignore")
          original_html = html
          changes = []

          hero_block = "\n".join([
              "      <!-- YSP_HOME_HERO_IMAGE_START -->",
              "      <div class=\"home-hero-image-wrap\">",
              "        <img class=\"home-hero-image\" src=\"assets/img/home-hero-ysp.png\" alt=\"YSP Learn and Shine English journey hero image\">",
              "      </div>",
              "      <!-- YSP_HOME_HERO_IMAGE_END -->",
          ])

          html = re.sub(
              r"\s*<!-- YSP_HOME_HERO_IMAGE_START -->.*?<!-- YSP_HOME_HERO_IMAGE_END -->\s*",
              "\n",
              html,
              flags=re.S,
          )

          pattern = re.compile(
              r"(<section\b[^>]*class=\"[^\"]*\bhero\b[^\"]*\"[^>]*>)",
              flags=re.I,
          )
          match = pattern.search(html)

          if match:
              insert_at = match.end()
              html = html[:insert_at] + "\n" + hero_block + "\n" + html[insert_at:]
              changes.append("Inserted hero image into homepage hero section.")
          else:
              changes.append("WARNING: Could not find homepage hero section.")

          if html != original_html:
              index_path.write_text(html, encoding="utf-8")

          css_path.parent.mkdir(parents=True, exist_ok=True)

          if css_path.exists():
              css = css_path.read_text(encoding="utf-8", errors="ignore")
          else:
              css = ""

          original_css = css

          css = re.sub(
              r"/\* Homepage hero image \*/.*?(?=\n/\*|\Z)",
              "",
              css,
              flags=re.S,
          ).rstrip()

          hero_css = "\n".join([
              "/* Homepage hero image */",
              ".home-hero-image-wrap {",
              "  max-width: 1180px;",
              "  margin: -48px auto 46px;",
              "  border-radius: 34px;",
              "  overflow: hidden;",
              "  border: 1px solid #e7dccd;",
              "  background: #fffaf2;",
              "  box-shadow: 0 22px 54px rgba(60, 43, 25, 0.12);",
              "}",
              "",
              ".home-hero-image {",
              "  width: 100%;",
              "  height: auto;",
              "  display: block;",
              "}",
              "",
              "@media (max-width: 820px) {",
              "  .home-hero-image-wrap {",
              "    margin: -28px auto 34px;",
              "    border-radius: 22px;",
              "  }",
              "}",
          ])

          css = css + "\n\n" + hero_css.strip() + "\n"

          if css != original_css:
              css_path.write_text(css, encoding="utf-8")
              changes.append("Updated assets/css/site.css for homepage hero image.")

          report = [
              "Homepage Hero Image Report",
              "==========================",
              "",
              "Expected image path:",
              "- assets/img/home-hero-ysp.png",
              "",
              "Changes:",
          ]

          report.extend([f"- {item}" for item in changes])

          report_path.write_text("\n".join(report) + "\n", encoding="utf-8")
          print("\n".join(report))
          PY

      - name: Commit and push changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add homepage hero image"
            git push
          fi
