name: Update Homepage Copy SCAMPER

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-homepage-copy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update homepage text copy
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          ROOT = Path.cwd()
          index_path = ROOT / "index.html"
          report_dir = ROOT / ".github/workflow-reports"
          report_dir.mkdir(parents=True, exist_ok=True)
          report_path = report_dir / "homepage-copy-scamper-report.txt"

          if not index_path.exists():
              raise SystemExit("index.html not found at repository root.")

          html = index_path.read_text(encoding="utf-8", errors="ignore")
          original = html
          changes = []

          def sub_once(pattern, replacement, text, label, flags=re.I | re.S):
              new_text, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count:
                  changes.append(label)
              else:
                  changes.append("WARNING: not found - " + label)
              return new_text

          def replace_between(text, start_pattern, end_pattern, replacement, label):
              pattern = f"({start_pattern})(.*?)({end_pattern})"
              new_text, count = re.subn(pattern, r"\1" + replacement + r"\3", text, count=1, flags=re.I | re.S)
              if count:
                  changes.append(label)
              else:
                  changes.append("WARNING: not found - " + label)
              return new_text

          # Page title and description
          html = sub_once(
              r"<title>.*?</title>",
              "<title>YSP Learn &amp; Shine｜Practical English for Real Life</title>",
              html,
              "Updated page title."
          )

          html = sub_once(
              r'<meta\s+name="description"\s+content="[^"]*"\s*/?>',
              '<meta name="description" content="Practical English for real life, meaningful travel, and confident career communication — with lessons inspired by everyday situations in English-speaking environments.">',
              html,
              "Updated meta description."
          )

          # Hero
          html = replace_between(
              html,
              r'<section\b[^>]*class="[^"]*\bhero\b[^"]*"[^>]*>.*?<h1>',
              r'</h1>',
              "Practical English for Real Life",
              "Updated hero heading."
          )

          html = replace_between(
              html,
              r'<p\s+class="hero-subtitle">\s*',
              r'\s*</p>',
              "Practical English for real life, meaningful travel, and confident career communication — with lessons inspired by everyday situations in English-speaking environments.",
              "Updated hero subtitle."
          )

          # Courses intro
          html = replace_between(
              html,
              r'<p\s+class="section-note">\s*',
              r'\s*</p>',
              "Move from studying English to using English. Our courses are built around real situations, so you can practice what to say, how to say it, and when to use it.",
              "Updated Courses section description."
          )

          # Course cards by href.
          def update_course_card(text, href, kicker, heading, desc):
              pattern = re.compile(
                  r'(<a\b(?=[^>]*\bclass="[^"]*\bcourse-card\b[^"]*")(?=[^>]*\bhref="' + re.escape(href) + r'")[^>]*>)(.*?)(</a>)',
                  flags=re.I | re.S
              )
              m = pattern.search(text)
              if not m:
                  changes.append(f"WARNING: not found - course card {href}")
                  return text

              start, inner, end = m.group(1), m.group(2), m.group(3)

              inner2 = re.sub(r'(<p\s+class="card-kicker">\s*).*?(\s*</p>)', r'\1' + kicker + r'\2', inner, count=1, flags=re.I | re.S)
              inner2 = re.sub(r'(<h3>\s*).*?(\s*</h3>)', r'\1' + heading + r'\2', inner2, count=1, flags=re.I | re.S)
              inner2 = re.sub(r'(<p>(?!\s*<).*?)(</p>)', lambda mm: mm.group(1).split(">")[0] + ">" + desc + mm.group(2), inner2, count=1, flags=re.I | re.S)

              # Fallback for paragraph replacement if the structure is different.
              if desc not in inner2:
                  inner2 = re.sub(r'<p>\s*.*?\s*</p>', f'<p>{desc}</p>', inner2, count=1, flags=re.I | re.S)

              changes.append(f"Updated course card {href}.")
              return text[:m.start()] + start + inner2 + end + text[m.end():]

          html = update_course_card(
              html,
              "lessons/#ca-life",
              "Life &amp; Career",
              "Life &amp; Career English",
              "A practical course for learners who want to communicate more confidently in daily life, new environments, social situations, and career-related moments."
          )

          html = update_course_card(
              html,
              "lessons/#travel",
              "Travel",
              "Travel English",
              "A travel-focused course for learners who want to ask questions, solve problems, make plans, and enjoy trips with more confidence."
          )

          html = update_course_card(
              html,
              "lessons/#business",
              "Business",
              "Business English",
              "A workplace-focused course for learners who want to sound clearer, more professional, and more confident in interviews, meetings, emails, and team communication."
          )

          # Featured lessons intro/heading note if present. Keep h2 text, update optional note or add a short note.
          if "Start with selected lessons designed for immediate use in real conversations." not in html:
              featured_pattern = re.compile(
                  r'(<section\b[^>]*id="featured-lessons"[^>]*>.*?<h2>\s*Start learning\s*</h2>)',
                  flags=re.I | re.S
              )
              if featured_pattern.search(html):
                  html = featured_pattern.sub(
                      r'\1\n                  <p class="section-note">Start with selected lessons designed for immediate use in real conversations.</p>',
                      html,
                      count=1
                  )
                  changes.append("Added Featured Lessons description.")
              else:
                  changes.append("WARNING: featured-lessons section or Start learning heading not found.")

          # About
          html = replace_between(
              html,
              r'<section\s+id="about"[^>]*>.*?<div\s+class="about-box">\s*<p>\s*',
              r'\s*</p>',
              "YSP Learn &amp; Shine helps learners build English confidence through practical, situation-based lessons. Each course is designed to make English feel useful, natural, and easier to use in real life.",
              "Updated About section."
          )

          if html != original:
              index_path.write_text(html, encoding="utf-8")

          report = [
              "Homepage Copy SCAMPER Report",
              "============================",
              "",
              "Selected version:",
              "方案 5 — Modern Course Brand Version",
              "",
              "Hero subtitle:",
              "Practical English for real life, meaningful travel, and confident career communication — with lessons inspired by everyday situations in English-speaking environments.",
              "",
              "Changes:",
              *[f"- {c}" for c in changes],
          ]
          report_path.write_text("\n".join(report) + "\n", encoding="utf-8")
          print("\n".join(report))
          PY

      - name: Commit and push changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update homepage copy to modern course brand version"
            git push
          fi
