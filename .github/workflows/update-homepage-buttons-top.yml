name: Update Homepage Buttons and Top Link

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-homepage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update homepage buttons, anchors, and top button
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          ROOT = Path.cwd()
          index_path = ROOT / "index.html"
          css_path = ROOT / "assets" / "css" / "site.css"
          report_dir = ROOT / ".github" / "workflow-reports"
          report_dir.mkdir(parents=True, exist_ok=True)
          report_path = report_dir / "homepage-update-report.txt"

          if not index_path.exists():
              raise SystemExit("index.html not found at repository root.")

          html = index_path.read_text(encoding="utf-8", errors="ignore")
          original_html = html
          changes = []

          # 1. Add top anchor to body.
          def add_body_id(match):
              tag = match.group(0)
              attrs = match.group(1) or ""
              if re.search(r'\sid\s*=', attrs, flags=re.I):
                  return tag
              return f'<body id="top"{attrs}>'

          html2 = re.sub(r'<body([^>]*)>', add_body_id, html, count=1, flags=re.I)
          if html2 != html:
              changes.append("Added id=\"top\" to body.")
              html = html2

          # 2. Change View Lessons button to View Courses and scroll to courses section.
          patterns = [
              (
                  r'<a\s+class="btn-primary"\s+href="lessons/"\s*>\s*View Lessons\s*</a>',
                  '<a class="btn-primary" href="#courses">View Courses</a>'
              ),
              (
                  r'<a\s+href="lessons/"\s+class="btn-primary"\s*>\s*View Lessons\s*</a>',
                  '<a class="btn-primary" href="#courses">View Courses</a>'
              ),
          ]
          replaced = False
          for pattern, repl in patterns:
              html2 = re.sub(pattern, repl, html, count=1, flags=re.I)
              if html2 != html:
                  html = html2
                  replaced = True
                  break
          if not replaced:
              # More flexible fallback: first btn-primary containing View Lessons.
              html2 = re.sub(
                  r'<a([^>]*class="[^"]*\bbtn-primary\b[^"]*"[^>]*)href="[^"]*"([^>]*)>\s*View Lessons\s*</a>',
                  r'<a\1href="#courses"\2>View Courses</a>',
                  html,
                  count=1,
                  flags=re.I
              )
              if html2 != html:
                  html = html2
                  replaced = True

          if replaced:
              changes.append("Changed primary button from View Lessons to View Courses.")
          else:
              changes.append("WARNING: Could not find View Lessons button automatically.")

          # 3. Change Start Canada Life button to Featured Lessons and scroll to featured section.
          html2 = re.sub(
              r'<a([^>]*class="[^"]*\bbtn-secondary\b[^"]*"[^>]*)href="[^"]*"([^>]*)>\s*Start Canada Life[^<]*</a>',
              r'<a\1href="#featured-lessons"\2>Featured Lessons</a>',
              html,
              count=1,
              flags=re.I
          )
          if html2 != html:
              html = html2
              changes.append("Changed secondary button from Start Canada Life to Featured Lessons.")
          else:
              # Exact fallback for older homepage.
              html2 = html.replace(
                  '<a class="btn-secondary" href="lessons/ca-life/u1-l1.html">Start Canada Life U1-L1</a>',
                  '<a class="btn-secondary" href="#featured-lessons">Featured Lessons</a>'
              ).replace(
                  '<a class="btn-secondary" href="lessons/ca-life/u1-l12.html">Start Canada Life U1-L12</a>',
                  '<a class="btn-secondary" href="#featured-lessons">Featured Lessons</a>'
              )
              if html2 != html:
                  html = html2
                  changes.append("Changed secondary button using exact fallback.")
              else:
                  changes.append("WARNING: Could not find Start Canada Life button automatically.")

          # 4. Add id="courses" to the Courses section.
          if 'id="courses"' not in html:
              html2 = re.sub(
                  r'<section\s+class="section">\s*(<div class="section-header">\s*<div>\s*<p class="eyebrow">Courses</p>)',
                  r'<section id="courses" class="section">\n      \1',
                  html,
                  count=1,
                  flags=re.I | re.S
              )
              if html2 != html:
                  html = html2
                  changes.append("Added id=\"courses\" to Courses section.")
              else:
                  changes.append("WARNING: Could not find Courses section automatically.")

          # 5. Add id="featured-lessons" to the Featured Lessons section.
          if 'id="featured-lessons"' not in html:
              html2 = re.sub(
                  r'<section\s+class="section">\s*(<div class="section-header">\s*<div>\s*<p class="eyebrow">Featured Lessons</p>)',
                  r'<section id="featured-lessons" class="section">\n      \1',
                  html,
                  count=1,
                  flags=re.I | re.S
              )
              if html2 != html:
                  html = html2
                  changes.append("Added id=\"featured-lessons\" to Featured Lessons section.")
              else:
                  changes.append("WARNING: Could not find Featured Lessons section automatically.")

          # 6. Add floating Top button.
          top_button = '''\n  <!-- YSP_BACK_TO_TOP_START -->\n  <a class="back-to-top" href="#top" aria-label="Back to top">\n    <span class="top-arrow">↑</span>\n    <span class="top-label">Top</span>\n  </a>\n  <!-- YSP_BACK_TO_TOP_END -->\n'''
          html = re.sub(
              r'\s*<!-- YSP_BACK_TO_TOP_START -->.*?<!-- YSP_BACK_TO_TOP_END -->\s*',
              '\n',
              html,
              flags=re.S
          )
          if re.search(r'</body\s*>', html, flags=re.I):
              html = re.sub(r'</body\s*>', top_button + '\n</body>', html, count=1, flags=re.I)
              changes.append("Added floating Top button.")
          else:
              html += top_button
              changes.append("Added floating Top button at file end because </body> was not found.")

          if html != original_html:
              index_path.write_text(html, encoding="utf-8")

          # 7. Add CSS for scroll behavior and Top button.
          css_path.parent.mkdir(parents=True, exist_ok=True)
          css = css_path.read_text(encoding="utf-8", errors="ignore") if css_path.exists() else ""
          original_css = css

          top_css = r'''
          /* Homepage anchors and floating top button */
          html {
            scroll-behavior: smooth;
            scroll-padding-top: 110px;
          }

          .back-to-top {
            position: fixed;
            right: 24px;
            bottom: 24px;
            z-index: 9999;
            width: 58px;
            height: 58px;
            border-radius: 999px;
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1px;
            background: #1f1d1b;
            color: #ffffff;
            text-decoration: none;
            border: 1px solid rgba(255, 255, 255, 0.28);
            box-shadow: 0 14px 34px rgba(60, 43, 25, 0.22);
            opacity: 0.92;
          }

          .back-to-top:hover {
            transform: translateY(-2px);
            opacity: 1;
            transition: 180ms ease;
          }

          .top-arrow {
            font-size: 22px;
            line-height: 1;
            font-weight: 900;
          }

          .top-label {
            font-size: 11px;
            line-height: 1;
            font-weight: 900;
            letter-spacing: 0.08em;
            text-transform: uppercase;
          }

          @media (max-width: 700px) {
            html {
              scroll-padding-top: 150px;
            }

            .back-to-top {
              right: 16px;
              bottom: 16px;
              width: 52px;
              height: 52px;
            }

            .top-arrow {
              font-size: 20px;
            }

            .top-label {
              font-size: 10px;
            }
          }
          '''

          # Remove old block if rerunning.
          css = re.sub(
              r'/\* Homepage anchors and floating top button \*/.*?(?=\n/\*|\Z)',
              '',
              css,
              flags=re.S
          ).rstrip()

          css = css + "\n\n" + top_css.strip() + "\n"

          if css != original_css:
              css_path.write_text(css, encoding="utf-8")
              changes.append("Updated assets/css/site.css for smooth scroll and Top button.")

          report = [
              "Homepage Update Report",
              "======================",
              "",
              "Changes:",
              *[f"- {c}" for c in changes],
              "",
              "Next step reminder:",
              "- Start building the file link checker workflow.",
          ]
          report_path.write_text("\n".join(report) + "\n", encoding="utf-8")
          print("\n".join(report))
          PY

      - name: Commit and push changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update homepage buttons and top link"
            git push
          fi
