name: Update Site Lesson Cards Only

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "lessons/**/*.html"
      - "scripts/update-site-lesson-cards-only.mjs"
      - ".github/workflows/update-site-lesson-cards-only.yml"

permissions:
  contents: write

jobs:
  update-site-lesson-cards-only:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Update homepage and lessons cards only
        run: node scripts/update-site-lesson-cards-only.mjs

      - name: Commit updated index files only
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain index.html lessons/index.html)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add index.html lessons/index.html
            git commit -m "Update site lesson cards"
            git push
          else
            echo "No index changes to commit."
          fi
