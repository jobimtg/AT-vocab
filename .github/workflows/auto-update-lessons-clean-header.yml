name: YSP Auto Site Maintenance

on:
  workflow_dispatch:
  push:
    paths:
      - "lessons/**/*.html"
      - "!lessons/index.html"

permissions:
  contents: write

concurrency:
  group: ysp-auto-site-maintenance
  cancel-in-progress: true

jobs:
  maintain-site:
    if: github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Auto update Lessons index and all lesson navigation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import urlparse, unquote
          import html as html_lib
          import os
          import re
          import shutil

          ROOT = Path.cwd()
          LESSONS_ROOT = ROOT / "lessons"
          LESSONS_INDEX = LESSONS_ROOT / "index.html"

          KNOWN_COURSES = {
              "ca-life": {
                  "label": "Canada Life & Career English",
                  "short": "Canada Life",
                  "emoji": "🏔️",
                  "anchor": "ca-life",
                  "description": "加拿大生活、工作、文化與實用口說英文。",
              },
              "travel": {
                  "label": "Travel English",
                  "short": "Travel",
                  "emoji": "✈️",
                  "anchor": "travel",
                  "description": "旅遊、交通、機場、飯店與日常旅遊情境。",
              },
              "business": {
                  "label": "Business English",
                  "short": "Business",
                  "emoji": "💼",
                  "anchor": "business",
                  "description": "職場、會議、接待與商務英文。",
              },
          }

          COURSE_ORDER = ["ca-life", "travel", "business"]

          IGNORE_SCHEMES = {"http", "https", "mailto", "tel", "javascript", "data"}

          MARKED_BLOCKS = [
              ("YSP_LESSON_NAV_START", "YSP_LESSON_NAV_END"),
              ("YSP_LESSON_FOOTER_START", "YSP_LESSON_FOOTER_END"),
              ("YSP_AUTO_TOP_ANCHOR_START", "YSP_AUTO_TOP_ANCHOR_END"),
              ("YSP_CLEAN_TOP_ANCHOR_START", "YSP_CLEAN_TOP_ANCHOR_END"),
              ("YSP_TOP_ANCHOR_START", "YSP_TOP_ANCHOR_END"),
              ("YSP_PAGE_TOP_ANCHOR_START", "YSP_PAGE_TOP_ANCHOR_END"),
              ("YSP_AUTO_TOP_BUTTON_START", "YSP_AUTO_TOP_BUTTON_END"),
              ("YSP_CLEAN_TOP_BUTTON_START", "YSP_CLEAN_TOP_BUTTON_END"),
              ("YSP_TOP_BUTTON_START", "YSP_TOP_BUTTON_END"),
              ("YSP_PAGE_TOP_BUTTON_START", "YSP_PAGE_TOP_BUTTON_END"),
              ("YSP_BACK_TO_TOP_START", "YSP_BACK_TO_TOP_END"),
              ("YSP_CLEAN_TOP_STYLE_START", "YSP_CLEAN_TOP_STYLE_END"),
              ("YSP_TOP_BUTTON_STYLE_START", "YSP_TOP_BUTTON_STYLE_END"),
              ("YSP_AUTO_NAV_STYLE_START", "YSP_AUTO_NAV_STYLE_END"),
              ("YSP_LESSON_SITE_NAV_STYLE_START", "YSP_LESSON_SITE_NAV_STYLE_END"),
              ("YSP_GLOBAL_LESSON_STYLE_START", "YSP_GLOBAL_LESSON_STYLE_END"),
          ]

          AUTO_LIBRARY_START = "<!-- YSP_AUTO_LESSON_LIBRARY_START -->"
          AUTO_LIBRARY_END = "<!-- YSP_AUTO_LESSON_LIBRARY_END -->"
          AUTO_LIBRARY_STYLE_START = "<!-- YSP_AUTO_LESSON_LIBRARY_STYLE_START -->"
          AUTO_LIBRARY_STYLE_END = "<!-- YSP_AUTO_LESSON_LIBRARY_STYLE_END -->"

          LESSONS_TOP_STYLE_START = "<!-- YSP_LESSONS_TOP_STYLE_START -->"
          LESSONS_TOP_STYLE_END = "<!-- YSP_LESSONS_TOP_STYLE_END -->"
          LESSONS_TOP_ANCHOR_START = "<!-- YSP_LESSONS_TOP_ANCHOR_START -->"
          LESSONS_TOP_ANCHOR_END = "<!-- YSP_LESSONS_TOP_ANCHOR_END -->"
          LESSONS_TOP_BUTTON_START = "<!-- YSP_LESSONS_TOP_BUTTON_START -->"
          LESSONS_TOP_BUTTON_END = "<!-- YSP_LESSONS_TOP_BUTTON_END -->"


          class PageParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.in_title = False
                  self.in_h1 = False
                  self.title_parts = []
                  self.h1_parts = []
                  self.ids = set()
                  self.links = []
                  self.assets = []

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)

                  if "id" in attrs:
                      self.ids.add(attrs["id"])
                  if "name" in attrs:
                      self.ids.add(attrs["name"])

                  if tag == "title":
                      self.in_title = True
                  if tag == "h1":
                      self.in_h1 = True

                  if tag == "a" and attrs.get("href"):
                      self.links.append(("href", attrs["href"]))
                  if tag in {"img", "script", "iframe", "source"} and attrs.get("src"):
                      self.assets.append(("src", attrs["src"]))
                  if tag == "link" and attrs.get("href"):
                      self.assets.append(("asset", attrs["href"]))

              def handle_endtag(self, tag):
                  if tag == "title":
                      self.in_title = False
                  if tag == "h1":
                      self.in_h1 = False

              def handle_data(self, data):
                  if self.in_title:
                      self.title_parts.append(data)
                  if self.in_h1:
                      self.h1_parts.append(data)


          def read_text(path: Path) -> str:
              return path.read_text(encoding="utf-8", errors="replace")


          def write_text(path: Path, text: str) -> None:
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(text, encoding="utf-8", newline="\n")


          def parse_file(path: Path) -> PageParser:
              parser = PageParser()
              parser.feed(read_text(path))
              return parser


          def clean_space(text: str) -> str:
              return re.sub(r"\s+", " ", text or "").strip()


          def strip_marker_block(text: str, start_marker: str, end_marker: str) -> str:
              pattern = re.escape(start_marker) + r".*?" + re.escape(end_marker)
              return re.sub(pattern, "", text, flags=re.S)


          def strip_named_blocks(text: str) -> str:
              for start, end in MARKED_BLOCKS:
                  text = re.sub(
                      r"\n?\s*<!--\s*" + re.escape(start) + r"\s*-->.*?<!--\s*" + re.escape(end) + r"\s*-->\s*\n?",
                      "\n",
                      text,
                      flags=re.I | re.S,
                  )

              text = re.sub(
                  r'\n?\s*<a\b[^>]*class=["\'][^"\']*\bysp-page-top-button\b[^"\']*["\'][\s\S]*?</a>\s*\n?',
                  "\n",
                  text,
                  flags=re.I,
              )

              return text


          def posix_relpath(target: Path, start: Path) -> str:
              return os.path.relpath(target, start).replace(os.sep, "/")


          def dir_href(rel_path: str) -> str:
              if rel_path in ("", "."):
                  return "./"
              return rel_path.rstrip("/") + "/"


          def url_join(base: str, *parts: str) -> str:
              clean_parts = [p.strip("/") for p in parts if p]
              if base in ("", "."):
                  return "/".join(clean_parts)
              return base.rstrip("/") + "/" + "/".join(clean_parts)


          def insert_before_head_end(html: str, block: str) -> str:
              if re.search(r"</head\s*>", html, flags=re.I):
                  return re.sub(r"</head\s*>", block + "\n</head>", html, count=1, flags=re.I)
              return block + "\n" + html


          def insert_after_body_start(html: str, block: str) -> str:
              if re.search(r"<body\b[^>]*>", html, flags=re.I):
                  return re.sub(r"(<body\b[^>]*>)", r"\1" + block, html, count=1, flags=re.I)
              return block + "\n" + html


          def insert_before_body_end(html: str, block: str) -> str:
              if re.search(r"</body\s*>", html, flags=re.I):
                  return re.sub(r"</body\s*>", block + "\n</body>", html, count=1, flags=re.I)
              return html + "\n" + block


          def ensure_site_css(html: str, css_href: str) -> str:
              if "assets/css/site.css" in html:
                  return re.sub(
                      r'href=["\'][^"\']*assets/css/site\.css["\']',
                      f'href="{css_href}"',
                      html,
                      flags=re.I,
                  )

              link = f'  <link rel="stylesheet" href="{css_href}">\n'
              return insert_before_head_end(html, link).replace(link + "\n</head>", link + "</head>")


          def rename_index_files() -> list[str]:
              renamed = []
              for path in list(ROOT.rglob("*")):
                  if not path.is_file():
                      continue
                  if ".git" in path.parts:
                      continue
                  if path.name.lower() == "index.html" and path.name != "index.html":
                      target = path.with_name("index.html")
                      temp = path.with_name("__ysp_temp_index_rename__.html")

                      if target.exists() and target.resolve() != path.resolve():
                          backup = path.with_suffix(path.suffix + ".backup")
                          shutil.move(str(path), str(backup))
                          renamed.append(f"{path.relative_to(ROOT)} -> {backup.relative_to(ROOT)}")
                          continue

                      shutil.move(str(path), str(temp))
                      shutil.move(str(temp), str(target))
                      renamed.append(f"{path.relative_to(ROOT)} -> {target.relative_to(ROOT)}")

              return renamed


          def slugify(text: str) -> str:
              text = text.lower().strip()
              text = re.sub(r"[^a-z0-9]+", "-", text)
              text = re.sub(r"-+", "-", text).strip("-")
              return text or "course"


          def course_config(key: str) -> dict:
              if key in KNOWN_COURSES:
                  return KNOWN_COURSES[key]

              label = key.replace("-", " ").replace("_", " ").title()
              return {
                  "label": label,
                  "short": label,
                  "emoji": "📘",
                  "anchor": slugify(key),
                  "description": "New lessons in this course folder are added automatically.",
              }


          def course_key_for(path: Path) -> str:
              try:
                  rel = path.relative_to(LESSONS_ROOT)
              except Exception:
                  return "other"
              return rel.parts[0] if rel.parts else "other"


          def lesson_title(path: Path) -> str:
              parser = parse_file(path)
              h1 = clean_space(" ".join(parser.h1_parts))
              title = clean_space(" ".join(parser.title_parts))
              raw = h1 or title or path.stem
              raw = re.sub(r"\s*\|\s*YSP.*$", "", raw, flags=re.I)
              raw = re.sub(r"\s*[-–—]\s*YSP.*$", "", raw, flags=re.I)
              raw = re.sub(r"^\s*Redirecting\.\.\.\s*$", path.stem, raw, flags=re.I)
              return raw.strip() or path.stem


          def sort_key_for_lesson(path: Path):
              key = course_key_for(path)
              stem = path.stem.lower()
              nums = [int(x) for x in re.findall(r"\d+", stem)]
              order = COURSE_ORDER.index(key) if key in COURSE_ORDER else 999
              return (order, key, nums, stem)


          def discover_lessons() -> list[dict]:
              lessons = []
              if not LESSONS_ROOT.exists():
                  return lessons

              for path in LESSONS_ROOT.glob("**/*.html"):
                  if ".git" in path.parts:
                      continue

                  try:
                      rel = path.relative_to(LESSONS_ROOT)
                  except Exception:
                      continue

                  if len(rel.parts) == 1 and path.name.lower() == "index.html":
                      continue

                  if path.name.lower() == "index.html":
                      continue

                  key = course_key_for(path)
                  href = posix_relpath(path, LESSONS_INDEX.parent)

                  lessons.append({
                      "path": path,
                      "key": key,
                      "title": lesson_title(path),
                      "href": href,
                  })

              lessons.sort(key=lambda item: sort_key_for_lesson(item["path"]))
              return lessons


