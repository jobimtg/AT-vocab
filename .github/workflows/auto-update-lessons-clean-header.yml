      - name: Commit and push automatic updates
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add lessons/index.html lessons/**/*.html

          if git diff --cached --quiet; then
            echo "No automatic updates to commit."
          else
            git commit -m "Auto update lessons and normalize Top button"
            git push
          fi
