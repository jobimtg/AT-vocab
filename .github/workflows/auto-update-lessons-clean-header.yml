              </span>
            </a>

            <nav class="site-nav" aria-label="Lesson navigation">
              <a href="{root_href}">Home</a>
              <a href="{lessons_href}">Lessons</a>
              <a href="{about_href}">About</a>
            </nav>
          </header>

          <div class="lesson-top-actions">
            <a class="back-to-lessons" href="{lessons_href}">← Back to Lessons</a>
          </div>
          <!-- YSP_LESSON_NAV_END -->
          """


          def build_lesson_footer(logo_src: str) -> str:
              return f"""
          <!-- YSP_LESSON_FOOTER_START -->
          <footer class="site-footer lesson-page-footer">
            <div class="footer-brand">
              <img class="footer-signature-logo" src="{logo_src}" alt="YSP signature logo">
              <span>YSP Learn &amp; Shine</span>
            </div>
            <p>Learn with Purpose. Shine with Confidence.</p>
          </footer>
          <!-- YSP_LESSON_FOOTER_END -->

          <!-- YSP_AUTO_TOP_BUTTON_START -->
          <a class="ysp-page-top-button" href="#top" aria-label="Back to top">
            <span class="ysp-page-top-arrow">↑</span>
            <span class="ysp-page-top-label">Top</span>
          </a>
          <!-- YSP_AUTO_TOP_BUTTON_END -->
          """


          def process_lesson_pages(lessons: list[dict]) -> list[str]:
              changed = []

              for item in lessons:
                  path = item["path"]
                  original = read_text(path)
                  html = strip_named_blocks(original)

                  file_dir = path.parent
                  rel_root = posix_relpath(ROOT, file_dir)
                  rel_lessons = posix_relpath(LESSONS_ROOT, file_dir)

                  root_href = dir_href(rel_root)
                  lessons_href = dir_href(rel_lessons)
                  about_href = f"{root_href}#about"

                  css_href = url_join(rel_root, "assets/css/site.css")
                  icon_src = url_join(rel_root, "assets/img/ysp-header-icon.png")
                  logo_src = url_join(rel_root, "assets/img/ysp-logo-script-overlay.png")

                  html = ensure_site_css(html, css_href)
                  html = insert_before_head_end(html, build_global_lesson_style())
                  html = insert_after_body_start(html, build_lesson_nav(root_href, lessons_href, about_href, icon_src))
                  html = insert_before_body_end(html, build_lesson_footer(logo_src))

                  html = re.sub(r"\n{4,}", "\n\n\n", html).strip() + "\n"

                  if html != original:
                      write_text(path, html)
                      changed.append(path.relative_to(ROOT).as_posix())

              return changed


