            }}

            @media (max-width: 760px) {{
              .ysp-page-top-button {{
                right: 16px;
                bottom: 16px;
                width: 52px;
                height: 52px;
              }}

              .ysp-auto-course-title {{
                align-items: flex-start;
                flex-direction: column;
              }}
            }}
          </style>
          {LESSONS_TOP_STYLE_END}"""


          def build_auto_library(lessons: list[dict]) -> str:
              grouped = {}
              for item in lessons:
                  grouped.setdefault(item["key"], []).append(item)

              ordered_keys = []
              for key in COURSE_ORDER:
                  if key in grouped:
                      ordered_keys.append(key)
              for key in sorted(grouped):
                  if key not in ordered_keys:
                      ordered_keys.append(key)

              lines = []
              lines.append(AUTO_LIBRARY_START)
              lines.append("<section class=\"ysp-auto-lesson-library\" id=\"lesson-library\">")
              lines.append("  <div class=\"ysp-auto-library-heading\">")
              lines.append("    <p class=\"eyebrow\">LESSON LIBRARY</p>")
              lines.append("    <h2>Choose Your Next Lesson</h2>")
              lines.append("    <p>This section is automatically updated from the HTML lesson files inside the lessons folder.</p>")
              lines.append("  </div>")

              for key in ordered_keys:
                  items = grouped.get(key, [])
                  cfg = course_config(key)
                  section_id = html_lib.escape(cfg["anchor"])
                  label = html_lib.escape(cfg["label"])
                  description = html_lib.escape(cfg["description"])

                  lines.append(f"  <section class=\"ysp-auto-course-section\" id=\"auto-{section_id}\">")
                  lines.append("    <div class=\"ysp-auto-course-title\">")
                  lines.append("      <div>")
                  lines.append(f"        <h3>{cfg['emoji']} {label}</h3>")
                  lines.append(f"        <p>{description}</p>")
                  lines.append("      </div>")
                  lines.append(f"      <span class=\"ysp-auto-count\">{len(items)} lessons</span>")
                  lines.append("    </div>")
                  lines.append("    <div class=\"ysp-auto-lesson-grid\">")

                  for item in items:
                      title = html_lib.escape(item["title"])
                      href = html_lib.escape(item["href"])
                      lines.append(f"      <a class=\"ysp-auto-lesson-card\" href=\"{href}\">")
                      lines.append(f"        <strong>{title}</strong>")
                      lines.append(f"        <span>{href}</span>")
                      lines.append("      </a>")

                  lines.append("    </div>")
                  lines.append("  </section>")

              lines.append("</section>")
              lines.append(AUTO_LIBRARY_END)
              return "\n".join(lines)


          def update_lessons_hero_copy(html: str) -> str:
              new_hero = "\n".join([
                  "    <section class=\"hero hero-lessons\">",
                  "      <p class=\"eyebrow\">LESSONS</p>",
                  "      <h1>Explore Your English Path and Find the Right Lesson for Your Next Step.</h1>",
                  "      <p class=\"hero-subtitle\">",
                  "        Choose a lesson path that matches your goal. Whether you want to build everyday confidence, prepare for travel, or improve workplace communication, each lesson is designed to help you use English in real situations.",
                  "      </p>",
                  "    </section>",
              ])

              pattern = re.compile(
                  r"\s*<section\b(?=[^>]*class=\"[^\"]*\bhero\b)(?=[^>]*class=\"[^\"]*\bhero-lessons\b)[^>]*>.*?</section>",
                  flags=re.I | re.S,
              )

              html, count = pattern.subn("\n" + new_hero, html, count=1)

              if count:
                  return html

              # Fallback: replace the first hero section on lessons/index.html.
              pattern = re.compile(
                  r"\s*<section\b(?=[^>]*class=\"[^\"]*\bhero\b)[^>]*>.*?</section>",
                  flags=re.I | re.S,
              )
              html, count = pattern.subn("\n" + new_hero, html, count=1)

              if count:
                  return html

              if re.search(r"<main\b[^>]*>", html, flags=re.I):
                  return re.sub(r"(<main\b[^>]*>)", r"\1\n" + new_hero, html, count=1, flags=re.I)

              return html


