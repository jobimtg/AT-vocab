          def update_lessons_index(lessons: list[dict]) -> bool:
              ensure_basic_lessons_index()
              original = read_text(LESSONS_INDEX)
              html = original

              for start, end in [
                  (AUTO_LIBRARY_START, AUTO_LIBRARY_END),
                  (AUTO_LIBRARY_STYLE_START, AUTO_LIBRARY_STYLE_END),
                  (LESSONS_TOP_STYLE_START, LESSONS_TOP_STYLE_END),
                  (LESSONS_TOP_ANCHOR_START, LESSONS_TOP_ANCHOR_END),
                  (LESSONS_TOP_BUTTON_START, LESSONS_TOP_BUTTON_END),
              ]:
                  html = strip_marker_block(html, start, end)

              # Remove old generic top blocks that caused duplicates.
              html = strip_named_blocks(html)

              html = ensure_site_css(html, "../assets/css/site.css")
              html = update_lessons_hero_copy(html)
              html = insert_before_head_end(html, build_lessons_page_style())

              top_anchor = "\n".join([
                  LESSONS_TOP_ANCHOR_START,
                  "<div id=\"top\" class=\"ysp-page-top-anchor\" aria-hidden=\"true\"></div>",
                  LESSONS_TOP_ANCHOR_END,
              ])

              if not re.search(r'id=["\']top["\']', html, flags=re.I):
                  html = insert_after_body_start(html, "\n" + top_anchor + "\n")

              library = build_auto_library(lessons)
              if re.search(r"</main\s*>", html, flags=re.I):
                  html = re.sub(r"</main\s*>", library + "\n  </main>", html, count=1, flags=re.I)
              elif re.search(r"</body\s*>", html, flags=re.I):
                  html = re.sub(r"</body\s*>", library + "\n</body>", html, count=1, flags=re.I)
              else:
                  html += "\n" + library + "\n"

              top_button = "\n".join([
                  LESSONS_TOP_BUTTON_START,
                  "<a class=\"ysp-page-top-button\" href=\"#top\" aria-label=\"Back to top\">",
                  "  <span class=\"ysp-page-top-arrow\">↑</span>",
                  "  <span class=\"ysp-page-top-label\">Top</span>",
                  "</a>",
                  LESSONS_TOP_BUTTON_END,
              ])
              html = insert_before_body_end(html, "\n" + top_button + "\n")

              html = re.sub(r"\n{4,}", "\n\n\n", html).strip() + "\n"

              if html != original:
                  write_text(LESSONS_INDEX, html)
                  return True
              return False


          def target_for(base_file: Path, raw_url: str):
              raw_url = (raw_url or "").strip()
              parsed = urlparse(raw_url)

              if not raw_url:
                  return None, None, "empty"
              if parsed.scheme in IGNORE_SCHEMES or raw_url.startswith("//"):
                  return None, None, "external"

              path_part = unquote(parsed.path)
              anchor = unquote(parsed.fragment) if parsed.fragment else None

              if path_part == "":
                  target = base_file
              elif path_part.startswith("/"):
                  clean = path_part.lstrip("/")
                  if clean.startswith("AT-vocab/"):
                      clean = clean[len("AT-vocab/"):]
                  target = ROOT / clean
              else:
                  target = base_file.parent / path_part

              if raw_url.endswith("/") or (path_part and not Path(path_part).suffix):
                  if target.is_dir():
                      target = target / "index.html"
                  elif (target / "index.html").exists():
                      target = target / "index.html"

              return target.resolve(), anchor, "internal"


          def link_check_to_console(lessons: list[dict]) -> tuple[int, int, int]:
              check_files = []
              if (ROOT / "index.html").exists():
                  check_files.append(ROOT / "index.html")
              if LESSONS_INDEX.exists():
                  check_files.append(LESSONS_INDEX)
              check_files.extend([item["path"] for item in lessons])

              parsed_files = {}
              missing_files = []
              missing_anchors = []
              checked = 0

              for file in sorted(set(check_files)):
                  parser = parse_file(file)
                  parsed_files[file.resolve()] = parser

                  for kind, url in parser.links + parser.assets:
                      target, anchor, status = target_for(file, url)
                      if status != "internal":
                          continue

                      checked += 1
                      base_rel = file.relative_to(ROOT).as_posix()

                      if target is None:
                          continue

                      if not target.exists():
                          missing_files.append((base_rel, kind, url))
                          continue

                      if anchor and target.suffix.lower() in {".html", ".htm"}:
                          target_parser = parsed_files.get(target)
                          if target_parser is None:
                              target_parser = parse_file(target)
                              parsed_files[target] = target_parser

                          if anchor not in target_parser.ids:
                              try:
                                  target_rel = target.relative_to(ROOT).as_posix()
                              except Exception:
                                  target_rel = str(target)
                              missing_anchors.append((base_rel, url, target_rel, anchor))

              print("Link check summary")
              print("==================")
              print(f"Files scanned: {len(set(check_files))}")
              print(f"Internal links/assets checked: {checked}")
              print(f"Missing files: {len(missing_files)}")
              print(f"Missing anchors: {len(missing_anchors)}")

              if missing_files:
                  print("")
                  print("Missing files:")
                  for base, kind, url in missing_files:
                      print(f"- {base} -> {kind} -> {url}")

              if missing_anchors:
                  print("")
                  print("Missing anchors:")
                  for base, url, target, anchor in missing_anchors:
                      print(f"- {base} -> {url} -> target {target} missing {anchor}")

              return len(missing_files), len(missing_anchors), checked


          renamed = rename_index_files()
          lessons = discover_lessons()
          updated_pages = process_lesson_pages(lessons)
          index_updated = update_lessons_index(lessons)
          missing_files, missing_anchors, checked = link_check_to_console(lessons)

          print("")
          print("YSP auto site maintenance summary")
          print("=================================")
          print(f"Index files renamed: {len(renamed)}")
          for item in renamed:
              print(f"- {item}")
          print(f"Lessons discovered: {len(lessons)}")
          print(f"Lesson pages with navigation refreshed: {len(updated_pages)}")
          for item in updated_pages:
              print(f"- {item}")
          print(f"lessons/index.html updated: {index_updated}")
          print(f"Missing files: {missing_files}")
          print(f"Missing anchors: {missing_anchors}")
          PY

      - name: Commit and push automatic updates
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No automatic updates to commit."
          else
            git commit -m "Auto maintain lessons and navigation"
            git push
          fi
