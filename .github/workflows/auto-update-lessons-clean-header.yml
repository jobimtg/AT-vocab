          def build_lesson_nav(root_href: str, lessons_href: str, about_href: str, icon_src: str) -> str:
              return f"""
          <!-- YSP_AUTO_TOP_ANCHOR_START -->
          <div id="top" class="ysp-page-top-anchor" aria-hidden="true"></div>
