name: Auto Update Lessons Clean Header

on:
  workflow_dispatch:
  push:
    paths:
      - "lessons/**/*.html"

permissions:
  contents: write

jobs:
  auto-update-lessons-clean-header:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Update lessons index, clean duplicate header, keep top button
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import urlparse, unquote
          import html as html_lib
          import os
          import re
          import shutil

          ROOT = Path.cwd()
          LESSONS_ROOT = ROOT / "lessons"
          LESSONS_INDEX = LESSONS_ROOT / "index.html"

          # No report files are committed in this clean version.
          old_report_dir = ROOT / ".github" / "workflow-reports"
          if old_report_dir.exists():
              shutil.rmtree(old_report_dir)

          AUTO_START = "<!-- YSP_AUTO_LESSON_LIBRARY_START -->"
          AUTO_END = "<!-- YSP_AUTO_LESSON_LIBRARY_END -->"
          TOP_STYLE_START = "<!-- YSP_CLEAN_TOP_STYLE_START -->"
          TOP_STYLE_END = "<!-- YSP_CLEAN_TOP_STYLE_END -->"
          TOP_ANCHOR_START = "<!-- YSP_CLEAN_TOP_ANCHOR_START -->"
          TOP_ANCHOR_END = "<!-- YSP_CLEAN_TOP_ANCHOR_END -->"
          TOP_BUTTON_START = "<!-- YSP_CLEAN_TOP_BUTTON_START -->"
          TOP_BUTTON_END = "<!-- YSP_CLEAN_TOP_BUTTON_END -->"

          COURSE_CONFIG = {
              "ca-life": {
                  "label": "Life & Career English",
                  "emoji": "🏔️",
                  "anchor": "life-career",
                  "description": "Practical English for daily life, settling in, and career confidence.",
              },
              "travel": {
                  "label": "Travel English",
                  "emoji": "✈️",
                  "anchor": "travel",
                  "description": "Useful English for airports, hotels, directions, food, and travel situations.",
              },
              "business": {
                  "label": "Business English",
                  "emoji": "💼",
                  "anchor": "business",
                  "description": "Workplace English for meetings, reception, colleagues, email, and communication.",
              },
          }

          TOP_STYLE = "\n".join([
              TOP_STYLE_START,
              "<style>",
              "  html { scroll-behavior: smooth; }",
              "  body { overflow-x: hidden; }",
              "  .ysp-page-top-anchor { position: absolute; top: 0; left: 0; width: 1px; height: 1px; pointer-events: none; }",
              "  .ysp-page-top-button { position: fixed; right: 24px; bottom: 24px; z-index: 99999; width: 58px; height: 58px; border-radius: 999px; display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; background: #1f1d1b; color: #ffffff; text-decoration: none; border: 1px solid rgba(255,255,255,.28); box-shadow: 0 14px 34px rgba(60,43,25,.22); opacity: .92; font-family: Inter, 'Noto Sans TC', 'Microsoft JhengHei', Arial, sans-serif; }",
              "  .ysp-page-top-button:hover { transform: translateY(-2px); opacity: 1; }",
              "  .ysp-page-top-arrow { font-size: 22px; line-height: 1; font-weight: 900; }",
              "  .ysp-page-top-label { font-size: 11px; line-height: 1; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; }",
              "  .ysp-auto-lesson-library { max-width: 1180px; margin: 48px auto 70px; padding: 0 24px; font-family: Inter, 'Noto Sans TC', 'Microsoft JhengHei', Arial, sans-serif; }",
              "  .ysp-auto-library-heading { text-align: center; margin-bottom: 28px; }",
              "  .ysp-auto-library-heading .eyebrow { color: #c4935d; letter-spacing: .28em; font-size: 12px; font-weight: 900; text-transform: uppercase; }",
              "  .ysp-auto-library-heading h2 { margin: 8px 0 10px; color: #13213b; font-size: clamp(28px, 4vw, 44px); line-height: 1.08; }",
              "  .ysp-auto-library-heading p { max-width: 760px; margin: 0 auto; color: #6f6257; font-size: 16px; line-height: 1.75; }",
              "  .ysp-auto-course-section { margin-top: 34px; }",
              "  .ysp-auto-course-title { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; border-bottom: 1px solid rgba(196,147,93,.28); padding-bottom: 12px; }",
              "  .ysp-auto-course-title h3 { margin: 0; color: #13213b; font-size: 24px; }",
              "  .ysp-auto-course-title p { margin: 4px 0 0; color: #74685d; font-size: 14px; }",
              "  .ysp-auto-count { color: #c4935d; font-size: 12px; font-weight: 900; letter-spacing: .12em; text-transform: uppercase; white-space: nowrap; }",
              "  .ysp-auto-lesson-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }",
              "  .ysp-auto-lesson-card { display: block; padding: 18px 18px 16px; border-radius: 20px; background: rgba(255,255,255,.82); border: 1px solid rgba(196,147,93,.28); box-shadow: 0 12px 30px rgba(60,43,25,.08); color: #13213b; text-decoration: none; }",
              "  .ysp-auto-lesson-card:hover { transform: translateY(-2px); box-shadow: 0 16px 36px rgba(60,43,25,.12); }",
              "  .ysp-auto-lesson-card strong { display: block; font-size: 17px; line-height: 1.35; margin-bottom: 8px; }",
              "  .ysp-auto-lesson-card span { display: block; color: #77695e; font-size: 13px; line-height: 1.55; }",
              "  @media (max-width: 760px) { .ysp-page-top-button { right: 16px; bottom: 16px; width: 52px; height: 52px; } }",
              "</style>",
              TOP_STYLE_END,
          ])

          class PageParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.in_title = False
                  self.in_h1 = False
                  self.title_parts = []
                  self.h1_parts = []
                  self.ids = set()
                  self.links = []
                  self.assets = []

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)

                  if "id" in attrs:
                      self.ids.add(attrs["id"])
                  if "name" in attrs:
                      self.ids.add(attrs["name"])

                  if tag == "title":
                      self.in_title = True
                  if tag == "h1":
                      self.in_h1 = True

                  if tag == "a" and attrs.get("href"):
                      self.links.append(("href", attrs["href"]))
                  if tag in {"img", "script", "iframe", "source"} and attrs.get("src"):
                      self.assets.append(("src", attrs["src"]))
                  if tag == "link" and attrs.get("href"):
                      self.assets.append(("asset", attrs["href"]))

              def handle_endtag(self, tag):
                  if tag == "title":
                      self.in_title = False
                  if tag == "h1":
                      self.in_h1 = False

              def handle_data(self, data):
                  if self.in_title:
                      self.title_parts.append(data)
                  if self.in_h1:
                      self.h1_parts.append(data)

          def parse_file(path):
              parser = PageParser()
              parser.feed(path.read_text(encoding="utf-8", errors="ignore"))
              return parser

          def clean_space(text):
              return re.sub(r"\s+", " ", text or "").strip()

          def strip_block(text, start, end):
              pattern = re.escape(start) + r".*?" + re.escape(end)
              return re.sub(pattern, "", text, flags=re.S)

          def remove_duplicate_auto_headers(html):
              blocks = [
                  ("<!-- YSP_AUTO_LESSON_NAV_START -->", "<!-- YSP_AUTO_LESSON_NAV_END -->"),
                  ("<!-- YSP_LESSON_SITE_NAV_START -->", "<!-- YSP_LESSON_SITE_NAV_END -->"),
                  ("<!-- YSP_PAGE_TOP_ANCHOR_START -->", "<!-- YSP_PAGE_TOP_ANCHOR_END -->"),
                  ("<!-- YSP_PAGE_TOP_BUTTON_START -->", "<!-- YSP_PAGE_TOP_BUTTON_END -->"),
                  ("<!-- YSP_TOP_ANCHOR_START -->", "<!-- YSP_TOP_ANCHOR_END -->"),
                  ("<!-- YSP_TOP_BUTTON_START -->", "<!-- YSP_TOP_BUTTON_END -->"),
                  ("<!-- YSP_BACK_TO_TOP_START -->", "<!-- YSP_BACK_TO_TOP_END -->"),
                  ("<!-- YSP_CLEAN_TOP_ANCHOR_START -->", "<!-- YSP_CLEAN_TOP_ANCHOR_END -->"),
                  ("<!-- YSP_CLEAN_TOP_BUTTON_START -->", "<!-- YSP_CLEAN_TOP_BUTTON_END -->"),
                  ("<!-- YSP_AUTO_NAV_STYLE_START -->", "<!-- YSP_AUTO_NAV_STYLE_END -->"),
                  ("<!-- YSP_LESSON_SITE_NAV_STYLE_START -->", "<!-- YSP_LESSON_SITE_NAV_STYLE_END -->"),
                  ("<!-- YSP_TOP_BUTTON_STYLE_START -->", "<!-- YSP_TOP_BUTTON_STYLE_END -->"),
                  ("<!-- YSP_CLEAN_TOP_STYLE_START -->", "<!-- YSP_CLEAN_TOP_STYLE_END -->"),
              ]

              for start, end in blocks:
                  html = strip_block(html, start, end)

              return html

          def add_clean_style(html):
              html = strip_block(html, TOP_STYLE_START, TOP_STYLE_END)
              if re.search(r"</head\s*>", html, flags=re.I):
                  return re.sub(r"</head\s*>", TOP_STYLE + "\n</head>", html, count=1, flags=re.I)
              return TOP_STYLE + "\n" + html

          def add_top_anchor(html):
              html = strip_block(html, TOP_ANCHOR_START, TOP_ANCHOR_END)

              if re.search("id=[\"']top[\"']", html, flags=re.I):
                  return html

              anchor = "\n".join([
                  TOP_ANCHOR_START,
                  "<div id=\"top\" class=\"ysp-page-top-anchor\" aria-hidden=\"true\"></div>",
                  TOP_ANCHOR_END,
              ])

              match = re.search(r"<body[^>]*>", html, flags=re.I)
              if match:
                  return html[:match.end()] + "\n" + anchor + "\n" + html[match.end():]

              return anchor + "\n" + html

          def add_top_button(html):
              html = strip_block(html, TOP_BUTTON_START, TOP_BUTTON_END)

              button = "\n".join([
                  TOP_BUTTON_START,
                  "<a class=\"ysp-page-top-button\" href=\"#top\" aria-label=\"Back to top\">",
                  "  <span class=\"ysp-page-top-arrow\">↑</span>",
                  "  <span class=\"ysp-page-top-label\">Top</span>",
                  "</a>",
                  TOP_BUTTON_END,
              ])

              if re.search(r"</body\s*>", html, flags=re.I):
                  return re.sub(r"</body\s*>", button + "\n</body>", html, count=1, flags=re.I)

              return html + "\n" + button + "\n"

          def lesson_title(path):
              parser = parse_file(path)
              h1 = clean_space(" ".join(parser.h1_parts))
              title = clean_space(" ".join(parser.title_parts))
              raw = h1 or title or path.stem
              raw = re.sub(r"\s*\|\s*YSP.*$", "", raw, flags=re.I)
              raw = re.sub(r"\s*[-–—]\s*YSP.*$", "", raw, flags=re.I)
              return raw.strip() or path.stem

          def course_key_for(path):
              try:
                  rel = path.relative_to(LESSONS_ROOT)
              except Exception:
                  return "other"
              return rel.parts[0] if rel.parts else "other"

          def sort_key(path):
              name = path.stem.lower()
              nums = [int(x) for x in re.findall(r"\d+", name)]
              return (course_key_for(path), nums, name)

          def rel_from_lessons_index(target):
              return os.path.relpath(target, start=LESSONS_INDEX.parent).replace(os.sep, "/")

          def discover_lessons():
              lessons = []

              if not LESSONS_ROOT.exists():
                  return lessons

              for path in LESSONS_ROOT.glob("**/*.html"):
                  if path.name.lower() == "index.html":
                      continue
                  if ".git" in path.parts:
                      continue

                  key = course_key_for(path)
                  if key not in COURSE_CONFIG:
                      continue

                  lessons.append({
                      "path": path,
                      "key": key,
                      "title": lesson_title(path),
                      "href": rel_from_lessons_index(path),
                  })

              lessons.sort(key=lambda item: sort_key(item["path"]))
              return lessons

          def make_auto_library(lessons):
              grouped = {}
              for item in lessons:
                  grouped.setdefault(item["key"], []).append(item)

              lines = []
              lines.append(AUTO_START)
              lines.append("<section class=\"ysp-auto-lesson-library\" id=\"lesson-library\">")
              lines.append("  <div class=\"ysp-auto-library-heading\">")
              lines.append("    <p class=\"eyebrow\">LESSON LIBRARY</p>")
              lines.append("    <h2>Choose Your Next Lesson</h2>")
              lines.append("    <p>This section is automatically updated from the HTML lesson files inside the lessons folder.</p>")
              lines.append("  </div>")

              for key in ["ca-life", "travel", "business"]:
                  items = grouped.get(key, [])
                  cfg = COURSE_CONFIG[key]
                  lines.append(f"  <section class=\"ysp-auto-course-section\" id=\"{cfg['anchor']}\">")
                  lines.append("    <div class=\"ysp-auto-course-title\">")
                  lines.append("      <div>")
                  lines.append(f"        <h3>{cfg['emoji']} {html_lib.escape(cfg['label'])}</h3>")
                  lines.append(f"        <p>{html_lib.escape(cfg['description'])}</p>")
                  lines.append("      </div>")
                  lines.append(f"      <span class=\"ysp-auto-count\">{len(items)} lessons</span>")
                  lines.append("    </div>")
                  lines.append("    <div class=\"ysp-auto-lesson-grid\">")

                  if items:
                      for item in items:
                          lines.append(f"      <a class=\"ysp-auto-lesson-card\" href=\"{html_lib.escape(item['href'])}\">")
                          lines.append(f"        <strong>{html_lib.escape(item['title'])}</strong>")
                          lines.append(f"        <span>{html_lib.escape(item['href'])}</span>")
                          lines.append("      </a>")
                  else:
                      lines.append("      <div class=\"ysp-auto-lesson-card\">")
                      lines.append("        <strong>Coming soon</strong>")
                      lines.append("        <span>New lessons will appear here automatically after upload.</span>")
                      lines.append("      </div>")

                  lines.append("    </div>")
                  lines.append("  </section>")

              lines.append("</section>")
              lines.append(AUTO_END)
              return "\n".join(lines)

          def ensure_lessons_index(lessons):
              if not LESSONS_INDEX.exists():
                  LESSONS_ROOT.mkdir(parents=True, exist_ok=True)
                  html = "\n".join([
                      "<!DOCTYPE html>",
                      "<html lang=\"en\">",
                      "<head>",
                      "  <meta charset=\"UTF-8\">",
                      "  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">",
                      "  <title>Lessons | YSP Learn & Shine</title>",
                      "</head>",
                      "<body>",
                      "  <section class=\"hero hero-lessons\">",
                      "    <p class=\"eyebrow\">LESSONS</p>",
                      "    <h1>Explore Your English Path and Find the Right Lesson for Your Next Step.</h1>",
                      "    <p class=\"hero-subtitle\">Choose a lesson path that matches your goal. Whether you want to build everyday confidence, prepare for travel, or improve workplace communication, each lesson is designed to help you use English in real situations.</p>",
                      "  </section>",
                      "</body>",
                      "</html>",
                  ])
              else:
                  html = LESSONS_INDEX.read_text(encoding="utf-8", errors="ignore")

              original = html
              html = remove_duplicate_auto_headers(html)
              block = make_auto_library(lessons)

              if AUTO_START in html and AUTO_END in html:
                  html = strip_block(html, AUTO_START, AUTO_END)

              if re.search(r"</body\s*>", html, flags=re.I):
                  html = re.sub(r"</body\s*>", block + "\n</body>", html, count=1, flags=re.I)
              else:
                  html = html + "\n" + block + "\n"

              html = add_clean_style(html)
              html = add_top_anchor(html)
              html = add_top_button(html)

              if html != original:
                  LESSONS_INDEX.write_text(html, encoding="utf-8")
                  return True

              return False

          def clean_lesson_pages(lessons):
              changed = []

              for item in lessons:
                  path = item["path"]
                  original = path.read_text(encoding="utf-8", errors="ignore")
                  html = remove_duplicate_auto_headers(original)
                  html = add_clean_style(html)
                  html = add_top_anchor(html)
                  html = add_top_button(html)

                  if html != original:
                      path.write_text(html, encoding="utf-8")
                      changed.append(path.relative_to(ROOT).as_posix())

              return changed

          IGNORE_SCHEMES = {"http", "https", "mailto", "tel", "javascript", "data"}

          def target_for(base_file, raw_url):
              raw_url = (raw_url or "").strip()
              parsed = urlparse(raw_url)

              if not raw_url:
                  return None, None, "empty"
              if parsed.scheme in IGNORE_SCHEMES or raw_url.startswith("//"):
                  return None, None, "external"

              path_part = unquote(parsed.path)
              anchor = unquote(parsed.fragment) if parsed.fragment else None

              if path_part == "":
                  target = base_file
              elif path_part.startswith("/"):
                  clean = path_part.lstrip("/")
                  if clean.startswith("AT-vocab/"):
                      clean = clean[len("AT-vocab/"):]
                  target = ROOT / clean
              else:
                  target = base_file.parent / path_part

              if raw_url.endswith("/") or (path_part and not Path(path_part).suffix):
                  if target.is_dir():
                      target = target / "index.html"
                  elif (target / "index.html").exists():
                      target = target / "index.html"

              return target.resolve(), anchor, "internal"

          def link_check_to_console(lessons):
              check_files = []
              if (ROOT / "index.html").exists():
                  check_files.append(ROOT / "index.html")
              if LESSONS_INDEX.exists():
                  check_files.append(LESSONS_INDEX)
              check_files.extend([item["path"] for item in lessons])

              parsed_files = {}
              missing_files = []
              missing_anchors = []
              checked = 0

              for file in sorted(set(check_files)):
                  parser = parse_file(file)
                  parsed_files[file.resolve()] = parser

                  for kind, url in parser.links + parser.assets:
                      target, anchor, status = target_for(file, url)
                      if status != "internal":
                          continue

                      checked += 1
                      base_rel = file.relative_to(ROOT).as_posix()

                      if target is None:
                          continue

                      if not target.exists():
                          missing_files.append((base_rel, kind, url))
                          continue

                      if anchor and target.suffix.lower() in {".html", ".htm"}:
                          target_parser = parsed_files.get(target)
                          if target_parser is None:
                              target_parser = parse_file(target)
                              parsed_files[target] = target_parser

                          if anchor not in target_parser.ids:
                              try:
                                  target_rel = target.relative_to(ROOT).as_posix()
                              except Exception:
                                  target_rel = str(target)
                              missing_anchors.append((base_rel, url, target_rel, anchor))

              print("Link check summary")
              print("==================")
              print(f"Files scanned: {len(set(check_files))}")
              print(f"Internal links/assets checked: {checked}")
              print(f"Missing files: {len(missing_files)}")
              print(f"Missing anchors: {len(missing_anchors)}")

              if missing_files:
                  print("")
                  print("Missing files:")
                  for base, kind, url in missing_files:
                      print(f"- {base} -> {kind} -> {url}")

              if missing_anchors:
                  print("")
                  print("Missing anchors:")
                  for base, url, target, anchor in missing_anchors:
                      print(f"- {base} -> {url} -> target {target} missing {anchor}")

              return len(missing_files), len(missing_anchors), checked

          lessons = discover_lessons()
          lessons_index_changed = ensure_lessons_index(lessons)
          cleaned_pages = clean_lesson_pages(lessons)
          missing_files, missing_anchors, checked = link_check_to_console(lessons)

          print("")
          print("Auto update summary")
          print("===================")
          print(f"Lessons discovered: {len(lessons)}")
          print(f"lessons/index.html updated: {lessons_index_changed}")
          print(f"Lesson pages cleaned/top refreshed: {len(cleaned_pages)}")
          print(f"Missing files: {missing_files}")
          print(f"Missing anchors: {missing_anchors}")
          PY

      - name: Commit and push automatic updates
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No automatic updates to commit."
          else
            git commit -m "Auto update lessons clean header"
            git push
          fi
