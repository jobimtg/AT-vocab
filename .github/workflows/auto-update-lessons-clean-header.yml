          <section id="how-it-works"><div class="section-head"><p class="eyebrow">How This Lesson Library Works</p><h2>Simple preview now. Deeper practice later.</h2><p>Public pages help you understand the learning style. Full practice packs and guided lessons are for learners who want structured review, speaking practice, and feedback.</p></div><div class="step-grid"><article class="card"><h3>1. Preview</h3><p>Use the public lesson page to understand the topic, goals, and sample language.</p></article><article class="card"><h3>2. Practice Pack</h3><p>Use full materials for vocabulary review, dialogues, speaking drills, and answer keys.</p></article><article class="card"><h3>3. Guided Lesson</h3><p>Book a class when you want correction, pronunciation support, and speaking practice.</p></article></div></section>
