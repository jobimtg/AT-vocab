name: Auto Update Lessons Clean Header

on:
  workflow_dispatch:
  push:
    paths:
      - "lessons/**/*.html"

permissions:
  contents: write

jobs:
  auto-update-lessons-clean-header:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Rebuild Lessons page and normalize Top buttons
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import html as html_lib
          import os
          import re
          import shutil

          ROOT = Path.cwd()
          LESSONS_ROOT = ROOT / "lessons"
          LESSONS_INDEX = LESSONS_ROOT / "index.html"

          report_dir = ROOT / ".github" / "workflow-reports"
          if report_dir.exists():
              shutil.rmtree(report_dir)

          COURSE_CONFIG = {
              "ca-life": {
                  "label": "Canada Life & Career English",
                  "short": "Canada Life",
                  "anchor": "life-career",
                  "tag": "Life & Career",
                  "description": "Daily life, settling in, work, housing, appointments, and useful communication for real situations.",
              },
              "travel": {
                  "label": "Travel English",
                  "short": "Travel",
                  "anchor": "travel",
                  "tag": "Travel",
                  "description": "Travel, transportation, airports, hotels, directions, restaurants, and everyday travel communication.",
              },
              "business": {
                  "label": "Business English",
                  "short": "Business",
                  "anchor": "business",
                  "tag": "Business",
                  "description": "Workplace conversations, meetings, reception, professional communication, and business confidence.",
              },
          }

          class PageParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.in_title = False
                  self.in_h1 = False
                  self.title_parts = []
                  self.h1_parts = []

              def handle_starttag(self, tag, attrs):
                  if tag.lower() == "title":
                      self.in_title = True
                  if tag.lower() == "h1":
                      self.in_h1 = True

              def handle_endtag(self, tag):
                  if tag.lower() == "title":
                      self.in_title = False
                  if tag.lower() == "h1":
                      self.in_h1 = False

              def handle_data(self, data):
                  if self.in_title:
                      self.title_parts.append(data)
                  if self.in_h1:
                      self.h1_parts.append(data)

          def read(path):
              return path.read_text(encoding="utf-8", errors="ignore")

          def write(path, text):
              path.write_text(text, encoding="utf-8")

          def clean_space(text):
              return re.sub(r"\s+", " ", text or "").strip()

          def strip_between(text, start, end):
              return re.sub(re.escape(start) + r".*?" + re.escape(end), "", text, flags=re.S)

          def parse_title(path):
              parser = PageParser()
              parser.feed(read(path))
              h1 = clean_space(" ".join(parser.h1_parts))
              title = clean_space(" ".join(parser.title_parts))
              raw = h1 or title or path.stem
              raw = re.sub(r"\s*\|\s*YSP.*$", "", raw, flags=re.I)
              raw = re.sub(r"\s*[-–—]\s*YSP.*$", "", raw, flags=re.I)
              return raw or path.stem

          def course_key(path):
              try:
                  rel = path.relative_to(LESSONS_ROOT)
              except Exception:
                  return ""
              return rel.parts[0] if rel.parts else ""

          def sort_key(item):
              path = item["path"]
              stem = path.stem.lower()
              nums = [int(n) for n in re.findall(r"\d+", stem)]
              return (course_key(path), nums, stem)

          def lesson_code(path):
              stem = path.stem.lower()
              match = re.search(r"u(\d+)[-_]?l(\d+)", stem)
              if match:
                  return f"U{match.group(1)}-L{match.group(2)}"
              nums = re.findall(r"\d+", stem)
              if nums:
                  return "L" + nums[-1]
              return "Preview"

          def lesson_summary(title, key):
              lower = title.lower()
              if "airport" in lower:
                  return "Practice useful airport and travel survival English."
              if "immigration" in lower or "security" in lower:
                  return "Practice useful questions and answers for airport security and immigration."
              if "welcome" in lower or "canada" in lower:
                  return "Practice useful English for arrival, daily life, and first conversations."
              if "business" in lower or "meeting" in lower or "office" in lower:
                  return "Practice clearer and more confident workplace communication."
              if key == "ca-life":
                  return "Practice useful English for daily life, settling in, and real situations."
              if key == "travel":
                  return "Practice useful English for travel situations and trip confidence."
              if key == "business":
                  return "Practice useful English for workplace and professional communication."
              return "Practice useful English for real situations."

          def discover_lessons():
              lessons = []
              if not LESSONS_ROOT.exists():
                  return lessons

              for path in LESSONS_ROOT.glob("**/*.html"):
                  if path.name.lower() == "index.html":
                      continue
                  key = course_key(path)
                  if key not in COURSE_CONFIG:
                      continue
                  href = os.path.relpath(path, start=LESSONS_INDEX.parent).replace(os.sep, "/")
                  title = parse_title(path)
                  lessons.append({
                      "path": path,
                      "key": key,
                      "href": href,
                      "title": title,
                      "code": lesson_code(path),
                      "summary": lesson_summary(title, key),
                  })

              lessons.sort(key=sort_key)
              return lessons

          def remove_duplicate_top_elements(text):
              marked_blocks = [
                  ("<!-- YSP_PAGE_TOP_ANCHOR_START -->", "<!-- YSP_PAGE_TOP_ANCHOR_END -->"),
                  ("<!-- YSP_PAGE_TOP_BUTTON_START -->", "<!-- YSP_PAGE_TOP_BUTTON_END -->"),
                  ("<!-- YSP_TOP_ANCHOR_START -->", "<!-- YSP_TOP_ANCHOR_END -->"),
                  ("<!-- YSP_TOP_BUTTON_START -->", "<!-- YSP_TOP_BUTTON_END -->"),
                  ("<!-- YSP_BACK_TO_TOP_START -->", "<!-- YSP_BACK_TO_TOP_END -->"),
                  ("<!-- YSP_CLEAN_TOP_ANCHOR_START -->", "<!-- YSP_CLEAN_TOP_ANCHOR_END -->"),
                  ("<!-- YSP_CLEAN_TOP_BUTTON_START -->", "<!-- YSP_CLEAN_TOP_BUTTON_END -->"),
                  ("<!-- YSP_CLEAN_TOP_STYLE_START -->", "<!-- YSP_CLEAN_TOP_STYLE_END -->"),
                  ("<!-- YSP_TOP_BUTTON_STYLE_START -->", "<!-- YSP_TOP_BUTTON_STYLE_END -->"),
              ]

              for start, end in marked_blocks:
                  text = strip_between(text, start, end)

              class_patterns = ["top-button", "ysp-page-top-button", "back-to-top", "scroll-top", "to-top"]

              for cls in class_patterns:
                  text = re.sub(
                      r"<a\b(?=[^>]*class=[\"'][^\"']*" + cls + r"[^\"']*[\"'])[^>]*>.*?</a>",
                      "",
                      text,
                      flags=re.I | re.S,
                  )
                  text = re.sub(
                      r"<button\b(?=[^>]*class=[\"'][^\"']*" + cls + r"[^\"']*[\"'])[^>]*>.*?</button>",
                      "",
                      text,
                      flags=re.I | re.S,
                  )

              text = re.sub(
                  r"<div\b(?=[^>]*id=[\"']top[\"'])(?=[^>]*class=[\"'][^\"']*(?:ysp-page-top-anchor|top-anchor)[^\"']*[\"'])[^>]*>\s*</div>",
                  "",
                  text,
                  flags=re.I | re.S,
              )

              return re.sub(r"\n{4,}", "\n\n\n", text)

          TOP_STYLE_START = "<!-- YSP_CLEAN_TOP_STYLE_START -->"
          TOP_ANCHOR_START = "<!-- YSP_CLEAN_TOP_ANCHOR_START -->"
          TOP_BUTTON_START = "<!-- YSP_CLEAN_TOP_BUTTON_START -->"

          TOP_STYLE = """<!-- YSP_CLEAN_TOP_STYLE_START -->
          <style>
            html { scroll-behavior: smooth; }
            body { overflow-x: hidden; }
            .ysp-page-top-anchor { position: absolute; top: 0; left: 0; width: 1px; height: 1px; pointer-events: none; }
            .ysp-page-top-button {
              position: fixed;
              right: 22px;
              bottom: 22px;
              z-index: 99999;
              width: 56px;
              height: 56px;
              display: inline-flex;
              flex-direction: column;
              align-items: center;
              justify-content: center;
              border-radius: 999px;
              background: #1f1d1b;
              color: #ffffff;
              text-decoration: none;
              border: 1px solid rgba(255,255,255,.28);
              box-shadow: 0 14px 34px rgba(60,43,25,.22);
              font-family: Inter, 'Noto Sans TC', 'Microsoft JhengHei', Arial, sans-serif;
              font-weight: 950;
            }
            .ysp-page-top-arrow { font-size: 20px; line-height: 1; }
            .ysp-page-top-label { margin-top: 1px; font-size: 10px; line-height: 1; letter-spacing: .08em; text-transform: uppercase; }
            @media (max-width: 760px) { .ysp-page-top-button { right: 16px; bottom: 16px; width: 52px; height: 52px; } }
          </style>
          <!-- YSP_CLEAN_TOP_STYLE_END -->"""

          TOP_ANCHOR = """<!-- YSP_CLEAN_TOP_ANCHOR_START -->
          <div id="top" class="ysp-page-top-anchor" aria-hidden="true"></div>
          <!-- YSP_CLEAN_TOP_ANCHOR_END -->"""

          TOP_BUTTON = """<!-- YSP_CLEAN_TOP_BUTTON_START -->
          <a class="ysp-page-top-button" href="#top" aria-label="Back to top">
            <span class="ysp-page-top-arrow">↑</span>
            <span class="ysp-page-top-label">Top</span>
          </a>
          <!-- YSP_CLEAN_TOP_BUTTON_END -->"""

          def add_single_top_to_html(text):
              text = remove_duplicate_top_elements(text)

              if TOP_STYLE_START not in text:
                  if re.search(r"</head\s*>", text, flags=re.I):
                      text = re.sub(r"</head\s*>", TOP_STYLE + "\n</head>", text, count=1, flags=re.I)
                  else:
                      text = TOP_STYLE + "\n" + text

              if not re.search(r"id=[\"']top[\"']", text, flags=re.I):
                  body = re.search(r"<body\b[^>]*>", text, flags=re.I)
                  if body:
                      text = text[:body.end()] + "\n" + TOP_ANCHOR + "\n" + text[body.end():]
                  else:
                      text = TOP_ANCHOR + "\n" + text

              if re.search(r"</body\s*>", text, flags=re.I):
                  text = re.sub(r"</body\s*>", TOP_BUTTON + "\n</body>", text, count=1, flags=re.I)
              else:
                  text = text + "\n" + TOP_BUTTON + "\n"

              return re.sub(r"\n{4,}", "\n\n\n", text)

          def clean_lesson_pages(lessons):
              changed = []
              for item in lessons:
                  path = item["path"]
                  original = read(path)
                  updated = add_single_top_to_html(original)

                  old_nav_blocks = [
                      ("<!-- YSP_AUTO_LESSON_NAV_START -->", "<!-- YSP_AUTO_LESSON_NAV_END -->"),
                      ("<!-- YSP_LESSON_SITE_NAV_START -->", "<!-- YSP_LESSON_SITE_NAV_END -->"),
                      ("<!-- YSP_AUTO_NAV_STYLE_START -->", "<!-- YSP_AUTO_NAV_STYLE_END -->"),
                      ("<!-- YSP_LESSON_SITE_NAV_STYLE_START -->", "<!-- YSP_LESSON_SITE_NAV_STYLE_END -->"),
                  ]
                  for start, end in old_nav_blocks:
                      updated = strip_between(updated, start, end)

                  if updated != original:
                      write(path, updated)
                      changed.append(path.relative_to(ROOT).as_posix())
              return changed

          def lesson_cards(items):
              if not items:
                  return """                    <article class="lesson-card">
                      <span class="tag">Coming Soon</span>
                      <h3>New preview lessons are coming soon</h3>
                      <p>New lessons will appear here after lesson HTML files are uploaded.</p>
                    </article>"""

              lines = []
              for item in items:
                  cfg = COURSE_CONFIG[item["key"]]
                  title = html_lib.escape(item["title"])
                  href = html_lib.escape(item["href"])
                  code = html_lib.escape(item["code"])
                  summary = html_lib.escape(item["summary"])
                  tag = html_lib.escape(cfg["tag"])
                  lines.append(f"""                    <article class="lesson-card">
                      <span class="tag">{tag} · {code}</span>
                      <h3>{title}</h3>
                      <p>{summary}</p>
                      <a href="{href}">View Preview →</a>
                    </article>""")
              return "\n\n".join(lines)

          def rebuild_lessons_index(lessons):
              LESSONS_ROOT.mkdir(parents=True, exist_ok=True)

              grouped = {key: [] for key in COURSE_CONFIG}
              for item in lessons:
                  grouped[item["key"]].append(item)

              course_sections = []
              for key in ["ca-life", "travel", "business"]:
                  cfg = COURSE_CONFIG[key]
                  section = f"""                <div id="{cfg['anchor']}" class="course-section">
                  <div class="course-title">
                    <div>
                      <p class="eyebrow">{html_lib.escape(cfg['short'])}</p>
                      <h2>{html_lib.escape(cfg['label'])}</h2>
                      <p>{html_lib.escape(cfg['description'])}</p>
                    </div>
                  </div>

                  <div class="grid-2">
          {lesson_cards(grouped[key])}
                  </div>
                </div>"""
                  course_sections.append(section)

              all_course_sections = "\n\n".join(course_sections)

              html = f"""<!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Lessons｜YSP Learn & Shine</title>
            <meta name="description" content="Choose your English learning path: Life & Career English, Travel English, and Business English preview lessons by YSP Learn & Shine.">
            <link rel="icon" href="../assets/img/ysp-header-icon.png">
            <style>
              :root {{
                --card: rgba(255, 255, 255, 0.88);
                --ink: #13213b;
                --muted: #6f6257;
                --gold: #c4935d;
                --gold-soft: rgba(196, 147, 93, 0.24);
                --navy: #162849;
                --shadow: 0 18px 50px rgba(60, 43, 25, 0.09);
                --radius-md: 22px;
              }}

              * {{ box-sizing: border-box; }}
              html {{ scroll-behavior: smooth; }}
              body {{
                margin: 0;
                overflow-x: hidden;
                background:
                  radial-gradient(circle at top left, rgba(230, 198, 145, 0.24), transparent 34%),
                  linear-gradient(180deg, #fff8ed 0%, #fffdf8 48%, #fff8ed 100%);
                color: var(--ink);
                font-family: Inter, "Noto Sans TC", "Microsoft JhengHei", Arial, sans-serif;
              }}
              img {{ max-width: 100%; display: block; }}
              a {{ color: inherit; }}

              .site-header {{
                position: sticky;
                top: 0;
                z-index: 50;
                background: rgba(255, 248, 237, 0.92);
                backdrop-filter: blur(14px);
                border-bottom: 1px solid var(--gold-soft);
              }}

              .nav-wrap {{
                width: min(1180px, calc(100% - 36px));
                min-height: 74px;
                margin: 0 auto;
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 20px;
              }}

              .brand {{
                display: inline-flex;
                align-items: center;
                gap: 12px;
                color: var(--ink);
                text-decoration: none;
              }}

              .brand img {{ width: 42px; height: 42px; object-fit: contain; }}
              .brand strong {{ display: block; font-size: 17px; letter-spacing: 0.02em; }}
              .brand span span {{ display: block; margin-top: 2px; color: var(--muted); font-size: 12px; }}

              .nav-links {{
                display: flex;
                align-items: center;
                justify-content: flex-end;
                gap: 10px;
                flex-wrap: wrap;
              }}

              .nav-links a,
              .btn {{
                display: inline-flex;
                align-items: center;
                justify-content: center;
                min-height: 42px;
                padding: 11px 16px;
                border-radius: 999px;
                border: 1px solid var(--gold-soft);
                background: rgba(255, 255, 255, 0.82);
                color: var(--ink);
                text-decoration: none;
                font-size: 14px;
                font-weight: 850;
                box-shadow: 0 8px 18px rgba(60, 43, 25, 0.06);
              }}

              .btn.primary,
              .nav-links a.primary {{ background: var(--navy); border-color: var(--navy); color: #ffffff; }}

              main {{ width: min(1180px, calc(100% - 36px)); margin: 0 auto; }}
              section {{ margin: 72px 0; }}

              .hero {{
                margin-top: 34px;
                padding: clamp(38px, 7vw, 78px) clamp(22px, 5vw, 70px);
                border: 1px solid var(--gold-soft);
                border-radius: 36px;
                background:
                  linear-gradient(135deg, rgba(255,255,255,0.94), rgba(255,246,229,0.86)),
                  radial-gradient(circle at top right, rgba(196,147,93,0.22), transparent 36%);
                box-shadow: var(--shadow);
                text-align: center;
              }}

              .eyebrow {{
                margin: 0 0 12px;
                color: var(--gold);
                font-size: 12px;
                font-weight: 950;
                letter-spacing: 0.28em;
                text-transform: uppercase;
              }}

              h1, h2, h3, p {{ margin-top: 0; }}
              h1 {{
                max-width: 900px;
                margin-left: auto;
                margin-right: auto;
                margin-bottom: 18px;
                font-size: clamp(38px, 6vw, 74px);
                line-height: 0.98;
                letter-spacing: -0.055em;
              }}

              .hero > p:not(.eyebrow) {{
                max-width: 790px;
                margin-left: auto;
                margin-right: auto;
                margin-bottom: 0;
                color: var(--muted);
                font-size: clamp(17px, 2vw, 21px);
                line-height: 1.75;
              }}

              .actions {{ display: flex; justify-content: center; flex-wrap: wrap; gap: 12px; margin-top: 28px; }}

              .section-head {{ max-width: 800px; margin: 0 auto 28px; text-align: center; }}
              .section-head h2 {{
                margin-bottom: 12px;
                font-size: clamp(30px, 4vw, 48px);
                line-height: 1.06;
                letter-spacing: -0.04em;
              }}
              .section-head p {{ color: var(--muted); font-size: 17px; line-height: 1.75; }}

              .grid-3 {{ display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }}
              .grid-2 {{ display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px; }}

              .card, .path-card, .lesson-card, .cta-card {{
                border: 1px solid var(--gold-soft);
                border-radius: var(--radius-md);
                background: var(--card);
                box-shadow: 0 14px 34px rgba(60, 43, 25, 0.07);
              }}

              .card {{ padding: 24px; }}
              .step-number {{
                width: 42px; height: 42px; margin-bottom: 18px;
                display: inline-flex; align-items: center; justify-content: center;
                border-radius: 50%; background: #fff3df; color: var(--gold); font-weight: 950;
              }}

              .card h3, .path-card h3, .lesson-card h3 {{ margin-bottom: 10px; font-size: 22px; }}
              .card p, .path-card p, .lesson-card p, .cta-card p {{ color: var(--muted); line-height: 1.7; }}

              .path-card {{ display: block; padding: 24px; color: var(--ink); text-decoration: none; }}

              .tag {{
                display: inline-flex;
                margin-bottom: 12px;
                padding: 6px 10px;
                border-radius: 999px;
                background: #fff3df;
                color: #9c6a34;
                font-size: 12px;
                font-weight: 900;
                letter-spacing: 0.08em;
                text-transform: uppercase;
              }}

              .course-section {{
                margin-top: 28px;
                padding: clamp(24px, 4vw, 36px);
                border: 1px solid var(--gold-soft);
                border-radius: 30px;
                background: rgba(255, 255, 255, 0.46);
              }}

              .course-title {{
                display: flex;
                align-items: flex-end;
                justify-content: space-between;
                gap: 18px;
                margin-bottom: 20px;
                flex-wrap: wrap;
              }}

              .course-title h2 {{ margin-bottom: 8px; font-size: clamp(28px, 4vw, 42px); letter-spacing: -0.04em; }}
              .course-title p {{ max-width: 720px; margin-bottom: 0; color: var(--muted); line-height: 1.7; }}
              .lesson-card {{ padding: 22px; }}
              .lesson-card a {{ display: inline-flex; margin-top: 12px; color: var(--navy); text-decoration: none; font-weight: 900; }}

              .cta-card {{ padding: clamp(28px, 5vw, 56px); text-align: center; }}
              .cta-card h2 {{
                margin-bottom: 14px;
                font-size: clamp(30px, 4vw, 46px);
                line-height: 1.08;
                letter-spacing: -0.04em;
              }}

              footer {{
                margin-top: 72px;
                padding: 36px 18px 46px;
                border-top: 1px solid var(--gold-soft);
                text-align: center;
                color: var(--muted);
              }}

              .footer-logo {{ width: 86px; margin: 0 auto 12px; }}
              .footer-est {{
                margin: 18px auto 0;
                padding-top: 14px;
                border-top: 1px solid var(--gold-soft);
                color: var(--gold);
                font-size: 12px;
                font-weight: 950;
                letter-spacing: 0.28em;
                text-transform: uppercase;
              }}

              .top-button {{
                position: fixed;
                right: 22px;
                bottom: 22px;
                z-index: 80;
                width: 56px;
                height: 56px;
                display: inline-flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                border-radius: 999px;
                background: #1f1d1b;
                color: #ffffff;
                text-decoration: none;
                box-shadow: 0 14px 34px rgba(60, 43, 25, 0.22);
                font-weight: 950;
              }}
              .top-button span:first-child {{ font-size: 20px; line-height: 1; }}
              .top-button span:last-child {{ margin-top: 1px; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; }}

              @media (max-width: 920px) {{
                .grid-3, .grid-2 {{ grid-template-columns: 1fr; }}
                .nav-wrap {{ align-items: flex-start; flex-direction: column; padding: 14px 0; }}
                .nav-links {{ justify-content: flex-start; }}
              }}

              @media (max-width: 620px) {{
                main {{ width: min(100% - 24px, 1180px); }}
                section {{ margin: 54px 0; }}
                h1 {{ font-size: clamp(34px, 12vw, 56px); }}
                .nav-links a, .btn {{ width: 100%; }}
                .actions {{ align-items: stretch; flex-direction: column; }}
              }}
            </style>
          </head>

          <body id="top">
            <header class="site-header">
              <div class="nav-wrap">
                <a class="brand" href="../" aria-label="YSP Learn & Shine home">
                  <img src="../assets/img/ysp-header-icon.png" alt="YSP Learn & Shine">
                  <span>
                    <strong>YSP Learn & Shine</strong>
                    <span>Learn with Purpose. Shine with Confidence.</span>
                  </span>
                </a>

                <nav class="nav-links" aria-label="Main navigation">
                  <a href="../">Home</a>
                  <a href="./">Lessons</a>
                  <a href="../#about">About</a>
                  <a class="primary" href="https://en.amazingtalker.com/teachers-and-tutors/jobi-pan#timeslots">Book a Trial Lesson</a>
                </nav>
              </div>
            </header>

            <main>
              <section class="hero" aria-label="Lessons introduction">
                <p class="eyebrow">Lessons</p>
                <h1>Explore Your English Path and Find the Right Lesson for Your Next Step.</h1>
                <p>Choose a lesson path that matches your goal. Whether you want to build everyday confidence, prepare for travel, or improve workplace communication, each lesson is designed to help you use English in real situations.</p>
                <div class="actions">
                  <a class="btn primary" href="#available-lessons">View Preview Lessons</a>
                  <a class="btn" href="#learning-paths">Choose a Learning Path</a>
                </div>
              </section>

              <section id="how-it-works" aria-label="How the lesson library works">
