name: Auto Update Lessons Clean Header

on:
  workflow_dispatch:
  push:
    paths:
      - "lessons/**/*.html"

permissions:
  contents: write

jobs:
  auto-update-lessons-clean-header:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run YSP lesson normalizer
        shell: bash
        run: |
          cat > /tmp/ysp_auto_update_lessons.py <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import html as html_lib
          import os
          import re
          import shutil

          ROOT = Path.cwd()
          LESSONS_ROOT = ROOT / "lessons"
          LESSONS_INDEX = LESSONS_ROOT / "index.html"

          COURSES = {
              "ca-life": {
                  "label": "Canada Life & Career English",
                  "short": "Canada Life",
                  "anchor": "life-career",
                  "tag": "Life & Career",
                  "description": "Daily life, settling in, work, housing, appointments, and useful communication for real situations.",
              },
              "travel": {
                  "label": "Travel English",
                  "short": "Travel",
                  "anchor": "travel",
                  "tag": "Travel",
                  "description": "Travel, transportation, airports, hotels, directions, restaurants, and everyday travel communication.",
              },
              "business": {
                  "label": "Business English",
                  "short": "Business",
                  "anchor": "business",
                  "tag": "Business",
                  "description": "Workplace conversations, meetings, reception, professional communication, and business confidence.",
              },
          }

          def read(path: Path) -> str:
              return path.read_text(encoding="utf-8", errors="ignore")

          def write(path: Path, text: str) -> None:
              path.write_text(text, encoding="utf-8")

          def squeeze(text: str) -> str:
              return re.sub(r"\n{4,}", "\n\n\n", text)

          def strip_between(text: str, start: str, end: str) -> str:
              return re.sub(re.escape(start) + r".*?" + re.escape(end), "", text, flags=re.S)

          class TitleParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.in_title = False
                  self.in_h1 = False
                  self.title = []
                  self.h1 = []

              def handle_starttag(self, tag, attrs):
                  if tag.lower() == "title":
                      self.in_title = True
                  if tag.lower() == "h1":
                      self.in_h1 = True

              def handle_endtag(self, tag):
                  if tag.lower() == "title":
                      self.in_title = False
                  if tag.lower() == "h1":
                      self.in_h1 = False

              def handle_data(self, data):
                  if self.in_title:
                      self.title.append(data)
                  if self.in_h1:
                      self.h1.append(data)

          def clean_text(text: str) -> str:
              return re.sub(r"\s+", " ", text or "").strip()

          def parse_title(path: Path) -> str:
              parser = TitleParser()
              parser.feed(read(path))
              raw = clean_text(" ".join(parser.h1)) or clean_text(" ".join(parser.title)) or path.stem
              raw = re.sub(r"\s*\|\s*YSP.*$", "", raw, flags=re.I)
              raw = re.sub(r"\s*[-–—]\s*YSP.*$", "", raw, flags=re.I)
              return raw or path.stem

          def course_key(path: Path) -> str:
              try:
                  rel = path.relative_to(LESSONS_ROOT)
              except ValueError:
                  return ""
              return rel.parts[0] if rel.parts else ""

          def lesson_code(path: Path) -> str:
              stem = path.stem.lower()
              m = re.search(r"u(\d+)[-_]?l(\d+)", stem)
              if m:
                  return f"U{m.group(1)}-L{m.group(2)}"
              nums = re.findall(r"\d+", stem)
              return "L" + nums[-1] if nums else "Preview"

          def lesson_summary(title: str, key: str) -> str:
              lower = title.lower()
              if "transportation" in lower:
                  return "Practice useful English for transportation, transit, and getting around."
              if "airport" in lower:
                  return "Practice useful airport and travel survival English."
              if "immigration" in lower or "security" in lower:
                  return "Practice useful questions and answers for airport security and immigration."
              if "welcome" in lower or "canada" in lower:
                  return "Practice useful English for arrival, daily life, and first conversations."
              if "business" in lower or "meeting" in lower or "office" in lower:
                  return "Practice clearer and more confident workplace communication."
              if key == "ca-life":
                  return "Practice useful English for daily life, settling in, and real situations."
              if key == "travel":
                  return "Practice useful English for travel situations and trip confidence."
              if key == "business":
                  return "Practice useful English for workplace and professional communication."
              return "Practice useful English for real situations."

          def discover_lessons():
              lessons = []
              if not LESSONS_ROOT.exists():
                  return lessons

              for path in LESSONS_ROOT.glob("**/*.html"):
                  if path.name.lower() == "index.html":
                      continue
                  key = course_key(path)
                  if key not in COURSES:
                      continue
                  href = os.path.relpath(path, start=LESSONS_INDEX.parent).replace(os.sep, "/")
                  lessons.append({
                      "path": path,
                      "key": key,
                      "href": href,
                      "title": parse_title(path),
                      "code": lesson_code(path),
                      "summary": lesson_summary(parse_title(path), key),
                  })

              def sort_key(item):
                  stem = item["path"].stem.lower()
                  nums = [int(n) for n in re.findall(r"\d+", stem)]
                  return (item["key"], nums, stem)

              lessons.sort(key=sort_key)
              return lessons

          def remove_internal_notes(text: str) -> str:
              bad = r"本分頁使用|請將圖片放在|完整發音教學圖|assets/pronunciation|pronunciation/[^<\s]+\.png"
              text = re.sub(r"<(p|div|li)[^>]*>[^<]*(?:" + bad + r")[^<]*</\1>", "", text, flags=re.I | re.S)
              kept = []
              for line in text.splitlines():
                  if re.search(bad, line, flags=re.I):
                      continue
                  kept.append(line)
              return "\n".join(kept)

          def remove_old_generated_blocks(text: str) -> str:
              blocks = [
                  ("<!-- YSP_AUTO_LESSON_NAV_START -->", "<!-- YSP_AUTO_LESSON_NAV_END -->"),
                  ("<!-- YSP_LESSON_SITE_NAV_START -->", "<!-- YSP_LESSON_SITE_NAV_END -->"),
                  ("<!-- YSP_AUTO_NAV_STYLE_START -->", "<!-- YSP_AUTO_NAV_STYLE_END -->"),
                  ("<!-- YSP_LESSON_SITE_NAV_STYLE_START -->", "<!-- YSP_LESSON_SITE_NAV_STYLE_END -->"),
                  ("<!-- YSP_LESSON_BRAND_NAV_START -->", "<!-- YSP_LESSON_BRAND_NAV_END -->"),
                  ("<!-- YSP_LESSON_BRAND_NAV_STYLE_START -->", "<!-- YSP_LESSON_BRAND_NAV_STYLE_END -->"),
                  ("<!-- YSP_PAGE_TOP_ANCHOR_START -->", "<!-- YSP_PAGE_TOP_ANCHOR_END -->"),
                  ("<!-- YSP_PAGE_TOP_BUTTON_START -->", "<!-- YSP_PAGE_TOP_BUTTON_END -->"),
                  ("<!-- YSP_TOP_ANCHOR_START -->", "<!-- YSP_TOP_ANCHOR_END -->"),
                  ("<!-- YSP_TOP_BUTTON_START -->", "<!-- YSP_TOP_BUTTON_END -->"),
                  ("<!-- YSP_BACK_TO_TOP_START -->", "<!-- YSP_BACK_TO_TOP_END -->"),
                  ("<!-- YSP_CLEAN_TOP_ANCHOR_START -->", "<!-- YSP_CLEAN_TOP_ANCHOR_END -->"),
                  ("<!-- YSP_CLEAN_TOP_BUTTON_START -->", "<!-- YSP_CLEAN_TOP_BUTTON_END -->"),
                  ("<!-- YSP_CLEAN_TOP_STYLE_START -->", "<!-- YSP_CLEAN_TOP_STYLE_END -->"),
              ]
              for start, end in blocks:
                  text = strip_between(text, start, end)

              text = re.sub(
                  r"<header\b(?=[^>]*class=[\"'][^\"']*(?:site-header|ysp-lesson-brand-header)[^\"']*[\"'])[^>]*>.*?</header>",
                  "",
                  text,
                  flags=re.I | re.S,
              )

              text = re.sub(
                  r"<a\b(?=[^>]*href=[\"'][^\"']*(?:\.\./|/)?lessons/?[\"'])(?=[^>]*class=[\"'][^\"']*(?:back|lesson-back|back-to-lessons|btn)[^\"']*[\"'])[^>]*>.*?</a>",
                  "",
                  text,
                  flags=re.I | re.S,
              )

              for cls in ["top-button", "ysp-page-top-button", "back-to-top", "scroll-top", "to-top"]:
                  text = re.sub(
                      r"<a\b(?=[^>]*class=[\"'][^\"']*" + cls + r"[^\"']*[\"'])[^>]*>.*?</a>",
                      "",
                      text,
                      flags=re.I | re.S,
                  )
                  text = re.sub(
                      r"<button\b(?=[^>]*class=[\"'][^\"']*" + cls + r"[^\"']*[\"'])[^>]*>.*?</button>",
                      "",
                      text,
                      flags=re.I | re.S,
                  )
              return text

          BRAND_STYLE = """<!-- YSP_LESSON_BRAND_NAV_STYLE_START -->
          <style>
          .ysp-lesson-brand-header{position:sticky;top:0;z-index:99998;background:rgba(247,241,232,.96);backdrop-filter:blur(14px);border-bottom:1px solid rgba(196,147,93,.24);font-family:Inter,'Noto Sans TC','Microsoft JhengHei',Arial,sans-serif}
          .ysp-lesson-brand-wrap{width:min(1180px,calc(100% - 36px));min-height:74px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:20px}
          .ysp-lesson-brand{display:inline-flex;align-items:center;gap:12px;color:#1f1d1b;text-decoration:none}
          .ysp-lesson-brand img{width:54px;height:54px;object-fit:contain}
          .ysp-lesson-brand strong{display:block;color:#1f1d1b;font-size:24px;line-height:1.05;letter-spacing:.08em;font-weight:900}
          .ysp-lesson-brand span span{display:block;margin-top:4px;color:#756f68;font-size:16px;font-weight:500}
          .ysp-lesson-nav{display:flex;align-items:center;justify-content:flex-end;gap:12px;flex-wrap:wrap}
          .ysp-lesson-nav a,.ysp-lesson-back-link{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:11px 18px;border-radius:999px;border:1px solid rgba(196,147,93,.24);background:rgba(255,255,255,.86);color:#14213d;text-decoration:none;font-size:15px;line-height:1;font-weight:900;box-shadow:0 10px 24px rgba(60,43,25,.08)}
          .ysp-lesson-back-wrap{width:min(1180px,calc(100% - 36px));margin:28px auto 0}
          .ysp-lesson-back-link{min-height:48px;padding:13px 22px}
          @media(max-width:820px){.ysp-lesson-brand-wrap{align-items:flex-start;flex-direction:column;padding:14px 0}.ysp-lesson-nav{justify-content:flex-start}}
          @media(max-width:520px){.ysp-lesson-nav a{width:100%}.ysp-lesson-brand strong{font-size:20px}.ysp-lesson-brand span span{font-size:13px}}
          </style>
          <!-- YSP_LESSON_BRAND_NAV_STYLE_END -->"""

          BRAND_NAV = """<!-- YSP_LESSON_BRAND_NAV_START -->
          <header class="ysp-lesson-brand-header">
            <div class="ysp-lesson-brand-wrap">
              <a class="ysp-lesson-brand" href="../../" aria-label="YSP Learn & Shine home">
                <img src="../../assets/img/ysp-header-icon.png" alt="YSP Learn & Shine">
                <span>
                  <strong>YSP Learn & Shine</strong>
                  <span>Learn with Purpose. Shine with Confidence.</span>
                </span>
              </a>
              <nav class="ysp-lesson-nav" aria-label="Lesson site navigation">
                <a href="../../">Home</a>
                <a href="../">Lessons</a>
                <a href="../../#about">About</a>
              </nav>
            </div>
          </header>
          <div class="ysp-lesson-back-wrap">
            <a class="ysp-lesson-back-link" href="../">← Back to Lessons</a>
          </div>
          <!-- YSP_LESSON_BRAND_NAV_END -->"""

          TOP_STYLE = """<!-- YSP_CLEAN_TOP_STYLE_START -->
          <style>
          html{scroll-behavior:smooth}body{overflow-x:hidden}
          .ysp-page-top-button{position:fixed;right:22px;bottom:22px;z-index:99999;width:56px;height:56px;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;border-radius:999px;background:#1f1d1b;color:#fff;text-decoration:none;border:1px solid rgba(255,255,255,.28);box-shadow:0 14px 34px rgba(60,43,25,.22);font-family:Inter,'Noto Sans TC','Microsoft JhengHei',Arial,sans-serif;font-weight:950}
          .ysp-page-top-arrow{font-size:20px;line-height:1}.ysp-page-top-label{margin-top:1px;font-size:10px;line-height:1;letter-spacing:.08em;text-transform:uppercase}
          @media(max-width:760px){.ysp-page-top-button{right:16px;bottom:16px;width:52px;height:52px}}
          </style>
          <!-- YSP_CLEAN_TOP_STYLE_END -->"""

          TOP_BUTTON = """<!-- YSP_CLEAN_TOP_BUTTON_START -->
          <a class="ysp-page-top-button" href="#top" aria-label="Back to top">
            <span class="ysp-page-top-arrow">↑</span>
            <span class="ysp-page-top-label">Top</span>
          </a>
          <!-- YSP_CLEAN_TOP_BUTTON_END -->"""

          def insert_before_head_end(text: str, block: str) -> str:
              if re.search(r"</head\s*>", text, flags=re.I):
                  return re.sub(r"</head\s*>", block + "\n</head>", text, count=1, flags=re.I)
              return block + "\n" + text

          def insert_after_body_start(text: str, block: str) -> str:
              match = re.search(r"<body\b[^>]*>", text, flags=re.I)
              if match:
                  return text[:match.end()] + "\n" + block + "\n" + text[match.end():]
              return block + "\n" + text

          def insert_before_body_end(text: str, block: str) -> str:
              if re.search(r"</body\s*>", text, flags=re.I):
                  return re.sub(r"</body\s*>", block + "\n</body>", text, count=1, flags=re.I)
              return text + "\n" + block

          def ensure_body_id_top(text: str) -> str:
              match = re.search(r"<body\b([^>]*)>", text, flags=re.I)
              if not match:
                  return text
              tag = match.group(0)
              if re.search(r"\bid\s*=", tag, flags=re.I):
                  return text
              new_tag = tag[:-1] + ' id="top">'
              return text[:match.start()] + new_tag + text[match.end():]

          def normalize_lesson_page(text: str) -> str:
              text = remove_old_generated_blocks(text)
              text = remove_internal_notes(text)
              text = ensure_body_id_top(text)
              text = insert_before_head_end(text, BRAND_STYLE)
              text = insert_before_head_end(text, TOP_STYLE)
              text = insert_after_body_start(text, BRAND_NAV)
              text = insert_before_body_end(text, TOP_BUTTON)
              return squeeze(text)

          def clean_lesson_pages(lessons):
              changed = []
              for item in lessons:
                  path = item["path"]
                  original = read(path)
                  updated = normalize_lesson_page(original)
                  if updated != original:
                      write(path, updated)
                      changed.append(path.relative_to(ROOT).as_posix())
              return changed

          def lesson_cards(items):
              if not items:
                  return """<article class="lesson-card"><span class="tag">Coming Soon</span><h3>New preview lessons are coming soon</h3><p>New lessons will appear here after lesson HTML files are uploaded.</p></article>"""
              rows = []
              for item in items:
                  cfg = COURSES[item["key"]]
                  rows.append(f"""<article class="lesson-card">
            <span class="tag">{html_lib.escape(cfg["tag"])} · {html_lib.escape(item["code"])}</span>
            <h3>{html_lib.escape(item["title"])}</h3>
            <p>{html_lib.escape(item["summary"])}</p>
            <a href="{html_lib.escape(item["href"])}">View Preview →</a>
          </article>""")
              return "\n".join(rows)

          def rebuild_lessons_index(lessons):
              grouped = {key: [] for key in COURSES}
              for item in lessons:
                  grouped[item["key"]].append(item)

              course_sections = []
              for key in ["ca-life", "travel", "business"]:
                  cfg = COURSES[key]
                  course_sections.append(f"""<section id="{cfg["anchor"]}" class="course-section">
            <div class="course-title">
              <p class="eyebrow">{html_lib.escape(cfg["short"])}</p>
              <h2>{html_lib.escape(cfg["label"])}</h2>
              <p>{html_lib.escape(cfg["description"])}</p>
            </div>
            <div class="lesson-grid">
          {lesson_cards(grouped[key])}
            </div>
          </section>""")

              html = f"""<!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <title>Lessons｜YSP Learn & Shine</title>
          <meta name="description" content="Choose your English learning path: Life & Career English, Travel English, and Business English preview lessons by YSP Learn & Shine.">
          <link rel="icon" href="../assets/img/ysp-header-icon.png">
          <style>
          :root{{--ink:#13213b;--muted:#6f6257;--gold:#c4935d;--gold-soft:rgba(196,147,93,.24);--navy:#162849;--card:rgba(255,255,255,.88)}}
          *{{box-sizing:border-box}}html{{scroll-behavior:smooth}}body{{margin:0;overflow-x:hidden;background:linear-gradient(180deg,#fff8ed 0%,#fffdf8 50%,#fff8ed 100%);color:var(--ink);font-family:Inter,'Noto Sans TC','Microsoft JhengHei',Arial,sans-serif}}a{{color:inherit}}img{{max-width:100%;display:block}}
          .site-header{{position:sticky;top:0;z-index:50;background:rgba(255,248,237,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--gold-soft)}}
          .nav-wrap{{width:min(1180px,calc(100% - 36px));min-height:74px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:20px}}
          .brand{{display:inline-flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink)}}.brand img{{width:42px;height:42px;object-fit:contain}}.brand strong{{display:block;font-size:17px}}.brand span span{{display:block;color:var(--muted);font-size:12px}}
          .nav-links{{display:flex;gap:10px;flex-wrap:wrap}}.nav-links a,.btn{{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:11px 16px;border-radius:999px;border:1px solid var(--gold-soft);background:rgba(255,255,255,.82);color:var(--ink);text-decoration:none;font-size:14px;font-weight:850;box-shadow:0 8px 18px rgba(60,43,25,.06)}}.nav-links a.primary,.btn.primary{{background:var(--navy);border-color:var(--navy);color:#fff}}
          main{{width:min(1180px,calc(100% - 36px));margin:0 auto}}section{{margin:72px 0}}.hero{{margin-top:34px;padding:clamp(38px,7vw,78px) clamp(22px,5vw,70px);border:1px solid var(--gold-soft);border-radius:36px;background:linear-gradient(135deg,rgba(255,255,255,.94),rgba(255,246,229,.86));box-shadow:0 18px 50px rgba(60,43,25,.09);text-align:center}}
          .eyebrow{{margin:0 0 12px;color:var(--gold);font-size:12px;font-weight:950;letter-spacing:.28em;text-transform:uppercase}}h1,h2,h3,p{{margin-top:0}}h1{{max-width:900px;margin:0 auto 18px;font-size:clamp(38px,6vw,74px);line-height:.98;letter-spacing:-.055em}}.hero p:not(.eyebrow){{max-width:790px;margin:0 auto;color:var(--muted);font-size:clamp(17px,2vw,21px);line-height:1.75}}
          .actions{{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;margin-top:28px}}.section-head{{max-width:800px;margin:0 auto 28px;text-align:center}}.section-head h2{{margin-bottom:12px;font-size:clamp(30px,4vw,48px);line-height:1.06;letter-spacing:-.04em}}.section-head p{{color:var(--muted);font-size:17px;line-height:1.75}}
          .path-grid,.step-grid{{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}}.lesson-grid{{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}}
          .card,.path-card,.lesson-card,.cta-card{{border:1px solid var(--gold-soft);border-radius:22px;background:var(--card);box-shadow:0 14px 34px rgba(60,43,25,.07)}}.card,.path-card,.lesson-card{{padding:24px}}.path-card{{text-decoration:none}}.tag{{display:inline-flex;margin-bottom:12px;padding:6px 10px;border-radius:999px;background:#fff3df;color:#9c6a34;font-size:12px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}}.card p,.path-card p,.lesson-card p,.cta-card p{{color:var(--muted);line-height:1.7}}.lesson-card a{{display:inline-flex;margin-top:12px;color:var(--navy);text-decoration:none;font-weight:900}}
          .course-section{{padding:clamp(24px,4vw,36px);border:1px solid var(--gold-soft);border-radius:30px;background:rgba(255,255,255,.46)}}.course-title{{margin-bottom:20px}}.cta-card{{padding:clamp(28px,5vw,56px);text-align:center}}footer{{margin-top:72px;padding:36px 18px 46px;border-top:1px solid var(--gold-soft);text-align:center;color:var(--muted)}}.footer-logo{{width:86px;margin:0 auto 12px}}.footer-est{{margin:18px auto 0;padding-top:14px;border-top:1px solid var(--gold-soft);color:var(--gold);font-size:12px;font-weight:950;letter-spacing:.28em;text-transform:uppercase}}.top-button{{position:fixed;right:22px;bottom:22px;z-index:80;width:56px;height:56px;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;border-radius:999px;background:#1f1d1b;color:#fff;text-decoration:none;box-shadow:0 14px 34px rgba(60,43,25,.22);font-weight:950}}
          @media(max-width:920px){{.path-grid,.step-grid,.lesson-grid{{grid-template-columns:1fr}}.nav-wrap{{align-items:flex-start;flex-direction:column;padding:14px 0}}}}
          @media(max-width:620px){{main{{width:min(100% - 24px,1180px)}}.nav-links a,.btn{{width:100%}}.actions{{flex-direction:column}}}}
          </style>
          </head>
          <body id="top">
          <header class="site-header"><div class="nav-wrap"><a class="brand" href="../"><img src="../assets/img/ysp-header-icon.png" alt="YSP Learn & Shine"><span><strong>YSP Learn & Shine</strong><span>Learn with Purpose. Shine with Confidence.</span></span></a><nav class="nav-links"><a href="../">Home</a><a href="./">Lessons</a><a href="../#about">About</a><a class="primary" href="https://en.amazingtalker.com/teachers-and-tutors/jobi-pan#timeslots">Book a Trial Lesson</a></nav></div></header>
          <main>
